<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Md Mesbahul Maruf — Robotics, Control & Autonomous Systems</title>
<meta name="description" content="Robotics, learning-based control, state estimation and multi-agent systems research by Md Mesbahul Maruf, Ph.D. student in Electrical & Computer Engineering at Auburn University.">
<meta property="og:title" content="Md Mesbahul Maruf — Robotics, Control & Autonomous Systems">
<meta property="og:description" content="Robotics, learning-based control, state estimation, multi-agent systems, and ground robotics research.">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Barlow:ital,wght@0,400;0,500;0,600;1,400&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">

<style>
/* ═══════════ TOKENS ═══════════ */
:root{
  --paper:#EDEFEA; --surface:#F7F8F4; --ink:#16180F;
  --muted:#5E6356; --rule:#C4C8BC; --hair:#DADDD3; --grid:#E1E4DA;
  --accent:#C7301A; --blue:#2F4E7E; --green:#3F7A4A; --gold:#B0821E;
  --f-disp:"Barlow Condensed",Impact,sans-serif;
  --f-body:"Barlow",system-ui,sans-serif;
  --f-mono:"Space Mono",ui-monospace,monospace;
  --maxw:1120px; --ease:cubic-bezier(.2,.7,.3,1);
}
[data-theme="dark"]{
  --paper:#0E1013; --surface:#171A1F; --ink:#E9EBE6;
  --muted:#868C84; --rule:#2A2E35; --hair:#1E2228; --grid:#191D23;
  --accent:#FF4A2B; --blue:#7FA9E6; --green:#5CC073; --gold:#E0AE44;
}
*,*::before,*::after{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0; background:var(--paper); color:var(--ink); font-family:var(--f-body);
  font-size:16.5px; line-height:1.6; -webkit-font-smoothing:antialiased; overflow-x:hidden;
  transition:background .4s var(--ease), color .4s var(--ease)}
a{color:inherit} img{display:block; max-width:100%}
::selection{background:var(--accent); color:#fff}
:focus-visible{outline:2px solid var(--accent); outline-offset:3px}
.wrap{max-width:var(--maxw); margin:0 auto; padding:0 30px}
#prog{position:fixed; top:0; left:0; height:3px; background:var(--accent); width:0; z-index:99; transition:width .12s linear}

/* ═══════════ HEADER ═══════════ */
.plate{position:sticky; top:0; z-index:60; background:var(--paper); border-bottom:2px solid var(--ink)}
.plate .wrap{display:flex; align-items:center; gap:20px; height:60px}
.tag{font-family:var(--f-mono); font-size:11px; font-weight:700; letter-spacing:.1em; text-transform:uppercase;
  text-decoration:none; background:var(--ink); color:var(--paper); padding:6px 10px; white-space:nowrap; transition:.25s var(--ease)}
.tag:hover{background:var(--accent); color:#fff; letter-spacing:.17em}
.plate nav{
  margin-left:auto;
  display:flex;
  align-items:center;
  flex-direction:row;
  flex-wrap:nowrap;
  white-space:nowrap;
  position:relative
}
.plate nav a{
  font-family:var(--f-disp);
  font-weight:600;
  font-size:15.5px;
  letter-spacing:.1em;
  text-transform:uppercase;
  text-decoration:none;
  color:var(--muted);
  padding:8px 14px;
  transition:color .25s var(--ease);
  position:relative;
  z-index:2;
  flex:0 0 auto;
  white-space:nowrap
}
.plate nav a:hover,.plate nav a.on{color:var(--ink)}
.nav-ink{position:absolute; bottom:-2px; left:0; height:3px; width:0; background:var(--accent);
  transition:transform .42s var(--ease), width .42s var(--ease); z-index:1; pointer-events:none}
.theme-btn{margin-left:14px; background:none; border:1.5px solid var(--rule); color:var(--muted);
  width:31px; height:31px; cursor:pointer; display:grid; place-items:center; padding:0; transition:.3s var(--ease)}
.theme-btn:hover{color:var(--ink); border-color:var(--accent); transform:rotate(90deg)}
.theme-btn svg{width:14px; height:14px}
.burger{display:none; margin-left:auto; background:none; border:1.5px solid var(--rule); width:34px; height:31px;
  cursor:pointer; color:var(--ink); font-family:var(--f-mono); font-size:11px}

/* ═══════════ PAGE TRANSITION + HEADS ═══════════ */
#view{transition:opacity .24s var(--ease), transform .24s var(--ease)}
#view.leaving{opacity:0; transform:translateY(-14px)}


.pagehead{padding:58px 30px 0; position:relative}
.pagehead::before{content:""; position:absolute; left:18px; top:0; width:6px; height:0; background:var(--accent); animation:growRule .8s .05s var(--ease) forwards}
@keyframes growRule{to{height:calc(100% - 12px)}}
.pagehead .kicker{font-family:var(--f-mono); font-size:11px; letter-spacing:.2em; text-transform:uppercase;
  color:var(--accent); margin:0 0 12px; opacity:0; animation:fadeUp .55s .1s var(--ease) forwards}
.pagehead h1{font-family:var(--f-disp); font-weight:700; text-transform:uppercase; letter-spacing:-.01em;
  font-size:clamp(2.4rem,7vw,4.6rem); line-height:.94; margin:0 0 18px; max-width:18ch}
.pagehead h1 span{display:block; overflow:hidden}
.pagehead h1 span i{display:block; font-style:normal; transform:translateY(105%); animation:riseIn .8s var(--ease) forwards}
.pagehead h1 span:nth-child(1) i{animation-delay:.08s}
.pagehead h1 span:nth-child(2) i{animation-delay:.18s}
.pagehead .sub{max-width:62ch; color:var(--muted); font-size:1.04rem; margin:0 0 6px; opacity:0; animation:fadeUp .6s .3s var(--ease) forwards}
.pagehead .sub strong{color:var(--ink); font-weight:600}
@keyframes riseIn{to{transform:none}}
@keyframes fadeUp{from{opacity:0; transform:translateY(12px)}to{opacity:1; transform:none}}

.hero h1{font-size:clamp(2.9rem,10.5vw,6.6rem); max-width:14ch}
.hero h1 span:nth-child(1) i{font-weight:500; color:var(--muted)}
.role{display:grid; grid-template-columns:minmax(300px,1.35fr) minmax(160px,.65fr) minmax(330px,1.5fr); margin:26px 0 0; border-top:1px solid var(--ink); border-bottom:1px solid var(--ink);
  opacity:0; animation:fadeUp .6s .4s var(--ease) forwards}
.role div{padding:11px 18px; margin:0; border-right:1px solid var(--rule);
  font-family:var(--f-mono); font-size:11px; letter-spacing:.05em; color:var(--muted)}
.role div:first-child{padding-left:0}
.role div:last-child{border-right:0}
.role b{display:block; font-weight:400; color:var(--ink); text-transform:uppercase; font-size:10px; letter-spacing:.12em; margin-bottom:2px}
.meta-row{display:flex; flex-wrap:wrap; margin-top:28px; opacity:0; animation:fadeUp .6s .5s var(--ease) forwards}
.meta-row a{font-family:var(--f-mono); font-size:11.5px; letter-spacing:.04em; text-decoration:none; color:var(--ink);
  border:1.5px solid var(--ink); padding:9px 16px; margin:0 -1.5px -1.5px 0; transition:.2s var(--ease); position:relative; overflow:hidden; z-index:0; overflow-wrap:anywhere}
.meta-row a::before{content:""; position:absolute; inset:0; background:var(--accent); transform:translateY(101%); transition:transform .28s var(--ease); z-index:-1}
.meta-row a:hover{color:#fff; border-color:var(--accent); z-index:2}
.meta-row a:hover::before{transform:none}

/* ═══════════ TICKER ═══════════ */
.ticker{overflow:hidden; border-top:1.5px solid var(--ink); border-bottom:1.5px solid var(--ink); margin-top:60px; background:var(--surface); padding:10px 0}
.ticker-track{display:flex; width:max-content; animation:slide 44s linear infinite}
.ticker:hover .ticker-track{animation-play-state:paused}
@keyframes slide{to{transform:translateX(-50%)}}
.ticker span{font-family:var(--f-mono); font-size:11px; letter-spacing:.14em; text-transform:uppercase; color:var(--muted); padding:0 20px; white-space:nowrap}
.ticker span::after{content:"◆"; color:var(--accent); margin-left:20px; font-size:8px; vertical-align:middle}

/* ═══════════ SECTIONS ═══════════ */
section{padding:64px 0 70px; border-bottom:1px solid var(--rule)}
section:last-of-type{border-bottom:none}
.dim{display:flex; align-items:center; margin-bottom:18px}
.dim .cap{width:1.5px; height:15px; background:var(--ink); flex:none; opacity:0; transition:opacity .3s .5s}
.dim.in .cap{opacity:1}
.dim .ln{height:1.5px; background:var(--ink); flex:1; transform:scaleX(0); transform-origin:left; transition:transform .95s var(--ease)}
.dim .ln:last-of-type{transform-origin:right}
.dim.in .ln{transform:scaleX(1)}
.dim .ln.short{flex:0 0 26px}
.dim h2{font-family:var(--f-disp); font-weight:700; font-size:21px; letter-spacing:.14em; text-transform:uppercase;
  margin:0; padding:0 15px; white-space:nowrap; opacity:0; transform:translateY(8px); transition:.5s .2s var(--ease)}
.dim.in h2{opacity:1; transform:none}
.dim .qty{font-family:var(--f-mono); font-size:11px; color:var(--muted); padding:0 14px; white-space:nowrap; opacity:0; transition:opacity .4s .5s}
.dim.in .qty{opacity:1}
.note{font-size:.93rem; color:var(--muted); max-width:64ch; margin:0 0 32px}

/* ═══════════ ABOUT: PORTRAIT + BIO ═══════════ */
.bio{display:grid; grid-template-columns:minmax(0,340px) minmax(0,1fr); gap:0 48px; align-items:start}
.portrait{position:relative; aspect-ratio:4/5; overflow:hidden; background:var(--surface); border:1px solid var(--rule)}
.portrait::before,.portrait::after{content:""; position:absolute; width:22px; height:22px; z-index:4; pointer-events:none}
.portrait::before{top:-1px; left:-1px; border-top:3px solid var(--accent); border-left:3px solid var(--accent)}
.portrait::after{bottom:-1px; right:-1px; border-bottom:3px solid var(--accent); border-right:3px solid var(--accent)}
.portrait img{position:absolute; inset:0; width:100%; height:100%; object-fit:cover;
  filter:none; transition:filter .6s var(--ease), transform .8s var(--ease)}
.portrait:hover img{transform:scale(1.03)}
.portrait .ph{display:none; position:absolute; inset:0; place-items:center; text-align:center;
  font-family:var(--f-mono); font-size:10.5px; letter-spacing:.14em; text-transform:uppercase; color:var(--muted); line-height:2.2; padding:20px}
.portrait.empty{border-style:dashed}
.portrait.empty::before,.portrait.empty::after{border-color:var(--rule)}
.portrait.empty .ph{display:grid}
.portrait-cap{
  font-family:var(--f-mono);
  font-size:9px;
  letter-spacing:.12em;
  text-transform:uppercase;
  color:var(--muted);
  margin:12px 0 0;
  display:flex;
  justify-content:space-between;
  gap:10px
}
.bio-text{
  max-width:760px;
  border-top:3px solid var(--ink);
  padding-top:18px
}
.bio-text::before{
  content:"Profile";
  display:block;
  margin-bottom:13px;
  font-family:var(--f-mono);
  font-size:8.5px;
  letter-spacing:.16em;
  text-transform:uppercase;
  color:var(--accent)
}
.bio-text p{
  font-family:var(--f-body);
  font-size:1rem;
  line-height:1.72;
  color:var(--muted);
  margin:0;
  padding:15px 0;
  border-bottom:1px solid var(--hair)
}
.bio-text p:first-child{
  padding-top:0;
  font-size:1.18rem;
  line-height:1.58;
  color:var(--ink)
}
.bio-text p strong{
  color:var(--ink);
  font-family:var(--f-body);
  font-weight:600
}
.pullquote{border-left:5px solid var(--accent); background:var(--surface); padding:20px 24px; margin:30px 0 0}
.pullquote span{display:block; font-family:var(--f-mono); font-size:10px; letter-spacing:.16em;
  text-transform:uppercase; color:var(--accent); margin-bottom:9px}
.pullquote p{margin:0; font-size:1.04rem; font-style:italic; color:var(--ink)}

/* ═══════════ FOCUS / HOBBY CARDS ═══════════ */
.focus{display:grid; grid-template-columns:repeat(auto-fit,minmax(240px,1fr))}
.foc{border:1.5px solid var(--rule); padding:24px 22px 26px; margin:0 -1.5px -1.5px 0;
  transition:.3s var(--ease); position:relative; overflow:hidden; color:var(--muted)}
.foc::after{content:""; position:absolute; left:0; bottom:0; height:3px; width:100%; background:var(--accent);
  transform:scaleX(0); transform-origin:left; transition:transform .4s var(--ease)}
.foc:hover{border-color:var(--accent); z-index:2; transform:translateY(-4px)}
.foc:hover::after{transform:scaleX(1)}
.foc svg{width:100%; height:66px; margin-bottom:18px; overflow:visible}
.foc h3{font-family:var(--f-disp); font-weight:600; font-size:1.3rem; text-transform:uppercase; line-height:1.06; margin:0 0 9px; color:var(--ink)}
.foc p{font-size:.88rem; margin:0}
.foc .n{position:absolute; top:16px; right:18px; font-family:var(--f-mono); font-size:10px; letter-spacing:.1em; color:var(--rule)}

/* glyph animations */
.dash{stroke-dasharray:190; stroke-dashoffset:190; animation:draw 3s var(--ease) infinite}
@keyframes draw{35%{stroke-dashoffset:0}85%{stroke-dashoffset:0}100%{stroke-dashoffset:-190}}
.blink{animation:fade 2.2s ease-in-out infinite}
@keyframes fade{0%,100%{opacity:.22}50%{opacity:1}}
.orbit{animation:spin 10s linear infinite; transform-origin:50px 32px}
@keyframes spin{to{transform:rotate(360deg)}}
.pulse{animation:pulseR 2.4s ease-in-out infinite}
@keyframes pulseR{0%,100%{r:3}50%{r:6.2}}
.drift1{animation:d1 5s ease-in-out infinite}
.drift2{animation:d2 6.4s ease-in-out infinite}
.drift3{animation:d3 4.4s ease-in-out infinite}
@keyframes d1{0%,100%{transform:translate(0,0)}50%{transform:translate(9px,-7px)}}
@keyframes d2{0%,100%{transform:translate(0,0)}50%{transform:translate(-11px,6px)}}
@keyframes d3{0%,100%{transform:translate(0,0)}50%{transform:translate(6px,9px)}}
.rove{animation:bob 2.6s ease-in-out infinite}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-3px)}}
.wheelspin{animation:spin 2.2s linear infinite}
.sweep{animation:sweepA 3.2s ease-in-out infinite; transform-origin:50px 42px}
@keyframes sweepA{0%,100%{transform:rotate(-32deg); opacity:.25}50%{transform:rotate(32deg); opacity:1}}
.ex1{animation:ex1 4s ease-in-out infinite}
.ex2{animation:ex2 4s ease-in-out infinite}
.ex3{animation:ex3 4s ease-in-out infinite}
.ex4{animation:ex4 4s ease-in-out infinite}
@keyframes ex1{0%,100%{transform:none}45%,65%{transform:translate(-16px,-11px)}}
@keyframes ex2{0%,100%{transform:none}45%,65%{transform:translate(16px,-11px)}}
@keyframes ex3{0%,100%{transform:none}45%,65%{transform:translate(-16px,11px)}}
@keyframes ex4{0%,100%{transform:none}45%,65%{transform:translate(16px,11px)}}
.bar{transform-origin:center 52px; animation:eq 1.1s ease-in-out infinite}
@keyframes eq{0%,100%{transform:scaleY(.28)}50%{transform:scaleY(1)}}
.strat{animation:fade 3s ease-in-out infinite}
.marker{animation:slideX 6s ease-in-out infinite}
@keyframes slideX{0%,100%{transform:translateX(0)}50%{transform:translateX(58px)}}

/* ═══════════ SIM / GAME ═══════════ */
.sim{margin:0; border:1.5px solid var(--rule); background:var(--surface); position:relative}
.sim::before,.sim::after{content:""; position:absolute; width:17px; height:17px; z-index:4; pointer-events:none}
.sim::before{top:-1.5px; left:-1.5px; border-top:2.5px solid var(--accent); border-left:2.5px solid var(--accent)}
.sim::after{bottom:-1.5px; right:-1.5px; border-bottom:2.5px solid var(--accent); border-right:2.5px solid var(--accent)}
.sim-bar{display:flex; align-items:center; gap:12px; flex-wrap:wrap; padding:10px 15px; border-bottom:1px solid var(--rule);
  font-family:var(--f-mono); font-size:10px; letter-spacing:.14em; text-transform:uppercase; color:var(--muted)}
.sim-bar .live{display:flex; align-items:center; gap:7px; color:var(--accent); font-weight:700}
.sim-bar .live i{width:6px; height:6px; background:var(--accent); border-radius:50%; animation:blip 1.6s infinite}
@keyframes blip{0%,100%{opacity:1; transform:scale(1)}50%{opacity:.2; transform:scale(.7)}}
.sim-bar .hint{margin-left:auto; text-transform:none; letter-spacing:.03em; opacity:.75}
.sim canvas{display:block; width:100%; touch-action:pan-y}
.sim-foot{display:grid; grid-template-columns:repeat(auto-fit,minmax(200px,1fr)); border-top:1px solid var(--rule)}
.knob{padding:13px 15px; border-right:1px solid var(--hair)}
.knob:last-child{border-right:0}
.knob label{display:flex; justify-content:space-between; gap:10px; align-items:baseline; font-family:var(--f-mono);
  font-size:10px; letter-spacing:.11em; text-transform:uppercase; color:var(--muted)}
.knob label b{color:var(--ink); font-weight:700; letter-spacing:.02em}
.knob input[type=range]{-webkit-appearance:none; appearance:none; width:100%; height:20px; background:none; margin:5px 0 0; cursor:pointer}
.knob input[type=range]::-webkit-slider-runnable-track{height:2px; background:var(--rule)}
.knob input[type=range]::-moz-range-track{height:2px; background:var(--rule)}
.knob input[type=range]::-webkit-slider-thumb{-webkit-appearance:none; width:12px; height:12px; background:var(--accent); margin-top:-5px; border:0; transition:transform .15s}
.knob input[type=range]:hover::-webkit-slider-thumb{transform:scale(1.3)}
.knob input[type=range]::-moz-range-thumb{width:12px; height:12px; background:var(--accent); border:0; border-radius:0}
.gauge{padding:13px 15px; border-right:1px solid var(--hair); font-family:var(--f-mono)}
.gauge:last-child{border-right:0}
.gauge span{display:block; font-size:10px; letter-spacing:.11em; text-transform:uppercase; color:var(--muted)}
.gauge b{display:block; font-size:19px; font-weight:700; color:var(--accent); margin-top:6px; line-height:1}
.gauge b.calm{color:var(--ink)}
.btnrow{padding:13px 15px; display:flex; align-items:center}
.gbtn{font-family:var(--f-mono); font-size:11px; letter-spacing:.1em; text-transform:uppercase; background:var(--ink);
  color:var(--paper); border:1.5px solid var(--ink); padding:10px 18px; cursor:pointer; margin-right:-1.5px; transition:.18s var(--ease)}
.gbtn:hover{background:var(--accent); border-color:var(--accent); color:#fff}
.gbtn.ghost{background:none; color:var(--muted); border-color:var(--rule)}
.gbtn.ghost:hover{color:var(--ink); border-color:var(--ink); background:none}
.gbtn.is-active{background:var(--accent); border-color:var(--accent); color:#fff}
.sim-note{padding:10px 15px; border-top:1px solid var(--hair); font-family:var(--f-mono); font-size:9.5px;
  line-height:1.55; letter-spacing:.04em; color:var(--muted)}
.drive-pad{display:grid; grid-template-columns:repeat(3,34px); grid-template-rows:repeat(2,30px); gap:4px; align-items:center; justify-content:center; padding:9px 12px}
.drive-btn{font-family:var(--f-mono); font-size:13px; line-height:1; border:1.5px solid var(--rule); color:var(--ink); background:var(--paper); cursor:pointer}
.drive-btn:hover,.drive-btn.pressed{border-color:var(--accent); background:var(--accent); color:#fff}
.drive-btn.up{grid-column:2;grid-row:1}.drive-btn.left{grid-column:1;grid-row:2}.drive-btn.down{grid-column:2;grid-row:2}.drive-btn.right{grid-column:3;grid-row:2}









/* ═══════════ 2D AUTONOMY EXPLORER ═══════════ */
.autoexp{overflow:hidden}

.autoexp-guide{
  padding:14px 16px;
  border-bottom:1px solid var(--rule);
  background:var(--surface)
}
.autoexp-guide h3{
  margin:0 0 7px;
  font-family:var(--f-cond);
  font-size:24px;
  color:var(--ink)
}
.autoexp-guide ul{
  margin:0;
  padding-left:18px;
  display:grid;
  grid-template-columns:repeat(2,minmax(0,1fr));
  gap:5px 24px;
  color:var(--muted);
  font-size:11px;
  line-height:1.5
}
.autoexp-guide b{color:var(--ink)}

.autoexp-selectbox{
  padding:14px;
  border-bottom:1px solid var(--rule);
  background:var(--paper)
}
.autoexp-selectbox label{
  display:flex;
  align-items:flex-end;
  justify-content:space-between;
  gap:12px;
  flex-wrap:wrap;
  margin-bottom:7px;
  font-family:var(--f-mono)
}
.autoexp-selectbox label span{
  color:var(--muted);
  font-size:9px;
  letter-spacing:.10em;
  text-transform:uppercase
}
.autoexp-selectbox label b{
  color:var(--ink);
  font-size:10px
}
.autoexp-select{
  width:100%;
  min-height:44px;
  padding:8px 10px;
  border:1.5px solid var(--rule);
  background:var(--surface);
  color:var(--ink);
  font-family:var(--f-mono);
  font-size:10px;
  cursor:pointer
}
.autoexp-select:focus{outline:2px solid var(--accent);outline-offset:2px}

.autoexp-hud{
  display:grid;
  grid-template-columns:1.5fr repeat(6,minmax(0,1fr));
  border-bottom:1px solid var(--rule);
  background:var(--surface)
}
.autoexp-hud>div{
  min-width:0;
  padding:10px 11px;
  border-right:1px solid var(--hair);
  font-family:var(--f-mono)
}
.autoexp-hud>div:last-child{border-right:0}
.autoexp-hud span{
  display:block;
  color:var(--muted);
  font-size:8px;
  letter-spacing:.10em;
  text-transform:uppercase
}
.autoexp-hud b{
  display:block;
  margin-top:3px;
  color:var(--ink);
  font-size:11px;
  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis
}


.autoexp-tuning{
  border-top:1px solid var(--rule);
  background:var(--surface)
}
.autoexp-tuning-head{
  display:flex;
  align-items:flex-end;
  justify-content:space-between;
  gap:12px;
  flex-wrap:wrap;
  padding:11px 14px 8px
}
.autoexp-tuning-head span{
  color:var(--muted);
  font-family:var(--f-mono);
  font-size:9px;
  letter-spacing:.10em;
  text-transform:uppercase
}
.autoexp-tuning-head b{
  color:var(--ink);
  font-family:var(--f-mono);
  font-size:10px
}
.autoexp-tuning-grid{
  display:grid;
  grid-template-columns:repeat(4,minmax(0,1fr));
  border-top:1px solid var(--hair)
}
.autoexp-tune{
  min-width:0;
  padding:11px 13px;
  border-right:1px solid var(--hair)
}
.autoexp-tune:last-child{border-right:0}
.autoexp-tune label{
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:8px;
  color:var(--muted);
  font-family:var(--f-mono);
  font-size:8px;
  letter-spacing:.08em;
  text-transform:uppercase
}
.autoexp-tune label b{
  color:var(--ink);
  font-size:10px
}
.autoexp-tune input[type="range"]{
  width:100%;
  margin-top:8px;
  accent-color:var(--accent)
}
.autoexp-tuning-note{
  padding:8px 14px 10px;
  border-top:1px solid var(--hair);
  color:var(--muted);
  font-family:var(--f-mono);
  font-size:8.5px;
  line-height:1.5
}
.autoexp-errorbar{
  height:5px;
  margin-top:6px;
  overflow:hidden;
  background:var(--hair)
}
.autoexp-errorbar i{
  display:block;
  height:100%;
  width:0%;
  background:var(--accent);
  transition:width .12s linear
}

.autoexp-actions{
  display:flex;
  align-items:center;
  gap:0;
  flex-wrap:wrap;
  border-top:1px solid var(--rule);
  background:var(--paper)
}
.autoexp-actions .btnrow{border-right:1px solid var(--hair)}
.autoexp-actions .gbtn.on{
  background:var(--accent);
  border-color:var(--accent);
  color:#fff
}

.autoexp-status{
  padding:10px 14px;
  border-top:1px solid var(--hair);
  background:var(--surface);
  color:var(--muted);
  font-family:var(--f-mono);
  font-size:9px;
  line-height:1.55
}
.autoexp-status b{color:var(--ink)}

.autoexp-progress{
  height:4px;
  background:var(--hair);
  border-top:1px solid var(--rule);
  overflow:hidden
}
.autoexp-progress i{
  display:block;
  width:0%;
  height:100%;
  background:var(--accent);
  transition:width .12s linear
}


.autoexp.home-stack .autoexp-guide{display:none}
.autoexp.home-stack .autoexp-selectbox{padding:11px 13px}
.autoexp.home-stack .autoexp-select{min-height:40px}
.autoexp.home-stack .autoexp-tuning{border-top:1px solid var(--hair)}
.autoexp.home-stack .autoexp-tuning-head{padding:9px 12px 7px}
.autoexp.home-stack .autoexp-tuning-grid{grid-template-columns:repeat(4,minmax(0,1fr))}
.autoexp.home-stack .autoexp-tune{padding:9px 10px}
.autoexp.home-stack .autoexp-tuning-note{display:none}
.autoexp.home-stack .autoexp-hud{
  grid-template-columns:repeat(4,minmax(0,1fr))
}
.autoexp.home-stack .home-primary-hud>div:nth-child(5),
.autoexp.home-stack .home-primary-hud>div:nth-child(6),
.autoexp.home-stack .home-primary-hud>div:nth-child(7){display:none}
.autoexp.home-stack .home-error-hud{
  grid-template-columns:repeat(3,minmax(0,1fr))!important
}
.autoexp.home-stack .autoexp-actions .btnrow{width:100%;border-right:0}
.autoexp.home-stack .autoexp-info{
  grid-template-columns:1.35fr 1fr
}
.autoexp.home-stack .autoexp-info>div:nth-child(2){display:none}
.autoexp.home-stack .autoexp-status{font-size:8.5px}
@media(max-width:760px){
  .autoexp.home-stack .autoexp-tuning-grid{grid-template-columns:1fr 1fr}
  .autoexp.home-stack .autoexp-hud{grid-template-columns:1fr 1fr}
  .autoexp.home-stack .autoexp-info{grid-template-columns:1fr}
}

.autoexp-info{
  display:grid;
  grid-template-columns:1.2fr 1fr 1fr;
  border-top:1px solid var(--rule);
  background:var(--paper)
}
.autoexp-info>div{
  min-width:0;
  padding:12px 13px;
  border-right:1px solid var(--hair)
}
.autoexp-info>div:last-child{border-right:0}
.autoexp-info .k{
  display:block;
  color:var(--accent);
  font-family:var(--f-mono);
  font-size:8px;
  letter-spacing:.10em;
  text-transform:uppercase
}
.autoexp-info b{
  display:block;
  margin-top:4px;
  color:var(--ink);
  font-size:11px;
  line-height:1.45
}
.autoexp-info p{
  margin:5px 0 0;
  color:var(--muted);
  font-size:10.5px;
  line-height:1.55
}

@media(max-width:900px){
  .autoexp-hud{grid-template-columns:repeat(4,minmax(0,1fr))}
  .autoexp-tuning-grid{grid-template-columns:1fr 1fr}
  .autoexp-tune:nth-child(2){border-right:0}
  .autoexp-tune{border-bottom:1px solid var(--hair)}
  .autoexp-info{grid-template-columns:1fr}
  .autoexp-info>div{border-right:0;border-bottom:1px solid var(--hair)}
}
@media(max-width:650px){
  .autoexp-guide ul{grid-template-columns:1fr}
  .autoexp-hud{grid-template-columns:1fr 1fr}
  .autoexp-tuning-grid{grid-template-columns:1fr}
  .autoexp-tune{border-right:0}
}


/* ═══════════ CONTACT ═══════════ */
.contact-grid{
  display:grid;
  grid-template-columns:minmax(0,1.2fr) minmax(280px,.8fr);
  gap:28px;
  align-items:start
}
.contact-card{
  border:1.5px solid var(--rule);
  background:var(--surface);
  padding:22px
}
.contact-card h2{
  margin:0 0 6px;
  font-family:var(--f-disp);
  font-size:30px;
  text-transform:uppercase;
  line-height:1
}
.contact-card>p{
  margin:0 0 20px;
  color:var(--muted);
  font-size:12px;
  line-height:1.6
}
.contact-form{
  display:grid;
  gap:13px
}
.contact-field label{
  display:block;
  margin-bottom:5px;
  color:var(--muted);
  font-family:var(--f-mono);
  font-size:8.5px;
  letter-spacing:.1em;
  text-transform:uppercase
}
.contact-field input,
.contact-field textarea{
  width:100%;
  border:1.5px solid var(--rule);
  background:var(--paper);
  color:var(--ink);
  padding:10px 11px;
  font:inherit;
  border-radius:0;
  outline:none
}
.contact-field input:focus,
.contact-field textarea:focus{border-color:var(--accent)}
.contact-field textarea{
  min-height:150px;
  resize:vertical
}
.contact-actions{
  display:flex;
  align-items:center;
  gap:8px;
  flex-wrap:wrap
}
.contact-actions button:disabled{
  opacity:.55;
  cursor:wait
}
.contact-status{
  color:var(--muted);
  font-family:var(--f-mono);
  font-size:8.5px;
  line-height:1.55
}
.contact-side{
  display:grid;
  gap:14px
}
.contact-mini,
.contact-inbox{
  border:1.5px solid var(--rule);
  background:var(--paper);
  padding:18px
}
.contact-mini span,
.contact-inbox span{
  display:block;
  color:var(--muted);
  font-family:var(--f-mono);
  font-size:8px;
  letter-spacing:.10em;
  text-transform:uppercase
}
.contact-mini b,
.contact-inbox b{
  display:block;
  margin-top:6px;
  color:var(--ink);
  font-size:13px
}
.contact-mini p,
.contact-inbox p{
  margin:7px 0 0;
  color:var(--muted);
  font-size:10.5px;
  line-height:1.55
}
.contact-mini a{
  color:var(--accent);
  text-decoration:none
}
.contact-inbox{border-style:dashed;background:var(--surface)}
@media(max-width:760px){
  .contact-grid{grid-template-columns:1fr}
}


.gif-media{position:relative}
.gif-media img{
  width:100%;
  height:100%;
  object-fit:cover;
  display:block
}
.gif-label{
  position:absolute;
  left:10px;
  bottom:10px;
  padding:6px 9px;
  background:rgba(0,0,0,.72);
  color:#fff;
  font-family:var(--f-mono);
  font-size:8px;
  letter-spacing:.08em;
  text-transform:uppercase
}

/* ═══════════ PROJECT ═══════════ */
.project{display:grid; grid-template-columns:minmax(0,1fr) minmax(0,42%); gap:0 42px; padding:42px 0 44px;
  border-top:1px solid var(--rule); position:relative}
.project.no-media{grid-template-columns:minmax(0,1fr)}
.project.no-media>div:first-child{max-width:850px}
.project::before{content:""; position:absolute; left:-30px; top:-1px; width:6px; height:0; background:var(--accent); transition:height .35s var(--ease)}
.project:hover::before{height:42px}
.p-idx{font-family:var(--f-mono); font-size:10.5px; letter-spacing:.14em; color:var(--rule); margin:0 0 6px}
.p-head{font-family:var(--f-mono); font-size:10.5px; letter-spacing:.13em; text-transform:uppercase; color:var(--muted); margin:0 0 12px}
.p-head .st{color:var(--accent)}
.project h3{font-family:var(--f-disp); font-weight:600; font-size:clamp(1.55rem,2.8vw,2.15rem); line-height:1.05; text-transform:uppercase; margin:0 0 15px}
.project p.body{font-size:.95rem; color:var(--muted); margin:0; max-width:56ch}
.sim-slot{grid-column:1/-1; margin-top:34px}
.spec{margin:22px 0 0; border-top:1px solid var(--rule)}
.spec div{display:flex; align-items:baseline; gap:8px; padding:7px 0; border-bottom:1px solid var(--hair); font-family:var(--f-mono); font-size:11px; color:var(--muted)}
.spec .lbl{text-transform:uppercase; letter-spacing:.06em; white-space:nowrap}
.spec .fill{flex:1; border-bottom:1px dotted var(--rule); transform:translateY(-3px)}
.spec .val{color:var(--accent); font-weight:700; white-space:nowrap}
.roles{font-family:var(--f-mono); font-size:11px; color:var(--muted); margin:18px 0 0; line-height:1.7}
.roles b{color:var(--ink); font-weight:400}
.tagline{display:flex; flex-wrap:wrap; gap:6px; margin-top:15px}
.tagline em{font-style:normal; font-family:var(--f-mono); font-size:10px; letter-spacing:.08em; text-transform:uppercase;
  color:var(--blue); border:1px solid var(--blue); padding:3px 8px; transition:.18s var(--ease)}
.tagline em:hover{background:var(--blue); color:var(--paper)}
.actions{display:flex; flex-wrap:wrap; margin-top:18px}
.actions a,.actions button{font-family:var(--f-mono); font-size:10.5px; letter-spacing:.06em; text-transform:uppercase;
  text-decoration:none; border:1.5px solid var(--rule); background:none; color:var(--muted); padding:7px 13px;
  margin:0 -1.5px -1.5px 0; cursor:pointer; transition:.18s var(--ease)}
.actions a:hover,.actions button:hover{color:var(--paper); background:var(--ink); border-color:var(--ink); position:relative; z-index:2}
.actions button[aria-expanded="true"]{color:var(--accent); border-color:var(--accent); position:relative; z-index:2}

.media{position:relative; aspect-ratio:16/9; overflow:hidden; background:var(--surface); border:1px solid var(--rule)}
.media::before,.media::after{content:""; position:absolute; width:19px; height:19px; z-index:4; pointer-events:none}
.media::before{top:-1px; left:-1px; border-top:2.5px solid var(--accent); border-left:2.5px solid var(--accent)}
.media::after{bottom:-1px; right:-1px; border-bottom:2.5px solid var(--accent); border-right:2.5px solid var(--accent)}
.media img,.media video,.media iframe{position:absolute; inset:0; width:100%; height:100%; border:0; object-fit:cover; transition:transform .6s var(--ease)}
/* Local MP4 playback: preserve the video's native aspect ratio instead of cropping it to 16:9. */
.media.playing-file{aspect-ratio:auto}
.media.playing-file video{position:relative; inset:auto; width:100%; height:auto; object-fit:contain; display:block}
.media:hover img{transform:scale(1.05)}
.media-btn{position:absolute; inset:0; width:100%; height:100%; background:none; border:0; padding:0; cursor:pointer; display:block}
.media-btn::after{content:""; position:absolute; inset:0; background:linear-gradient(180deg,transparent 45%,rgba(6,8,10,.62)); transition:opacity .25s var(--ease)}
.play{position:absolute; left:17px; bottom:15px; z-index:3; display:flex; align-items:center; gap:11px; font-family:var(--f-mono);
  font-size:10.5px; font-weight:700; letter-spacing:.14em; text-transform:uppercase; color:#fff; pointer-events:none}
.play span{width:32px; height:32px; background:var(--accent); display:grid; place-items:center; transition:transform .25s var(--ease)}
.play svg{width:10px; height:10px; margin-left:2px}
.media-btn:hover .play span{transform:scale(1.16)}
.media-btn:hover::after{opacity:.68}
.media.no-video{display:grid; place-items:center; border-style:dashed}
.media.no-video::before,.media.no-video::after{border-color:var(--rule)}
.media.no-video p{font-family:var(--f-mono); font-size:10.5px; letter-spacing:.14em; text-transform:uppercase;
  color:var(--muted); margin:0; text-align:center; line-height:2; padding:0 20px}

/* ═══════════ TIMELINE ═══════════ */
.tl{position:relative; padding-left:36px}
.tl::before{content:""; position:absolute; left:5px; top:8px; bottom:8px; width:1.5px; background:var(--rule);
  transform:scaleY(0); transform-origin:top; transition:transform 1.4s var(--ease)}
.tl.in::before{transform:scaleY(1)}
.tlx{position:relative; padding:0 0 32px}
.tlx::before{content:""; position:absolute; left:-36px; top:8px; width:12px; height:12px; background:var(--paper);
  border:2.5px solid var(--rule); transition:.3s var(--ease)}
.tlx:hover::before{border-color:var(--accent); transform:rotate(45deg) scale(1.15)}
.tlx.hot::before{border-color:var(--accent)}
.tlx .when{font-family:var(--f-mono); font-size:10.5px; letter-spacing:.1em; text-transform:uppercase;
  color:var(--muted); margin:0 0 5px; display:flex; gap:12px; flex-wrap:wrap; align-items:center}
.tlx .when b{font-weight:700; padding:2px 8px; border:1px solid var(--rule); color:var(--muted)}
.tlx.hot .when b{border-color:var(--accent); color:var(--accent)}
.tlx h3{font-family:var(--f-disp); font-weight:600; font-size:1.4rem; text-transform:uppercase; line-height:1.06; margin:0 0 4px}
.tlx .org{font-size:.93rem; color:var(--ink); margin:0 0 9px}
.tlx .org i{font-style:normal; color:var(--muted)}
.tlx ul{margin:0; padding-left:18px}
.tlx li{font-size:.9rem; color:var(--muted); margin-bottom:5px}
.tlx li::marker{color:var(--accent)}

/* ═══════════ PAPERS ═══════════ */
.paper{display:grid; grid-template-columns:196px minmax(0,1fr); gap:0 28px; padding:24px 0; border-top:1px solid var(--rule); transition:.25s var(--ease)}
.paper:hover{background:var(--surface)}
.stat{font-family:var(--f-mono); font-size:10.5px; letter-spacing:.1em; text-transform:uppercase; color:var(--muted); padding-top:5px}
.stat b{display:inline-block; font-weight:400; padding:4px 9px; border:1.5px solid var(--rule)}
.stat b.pub{border-color:var(--green); color:var(--green); font-weight:700}
.stat b.live{border-color:var(--accent); color:var(--accent); font-weight:700}
.stat .yr{display:block; margin-top:9px}
.paper h3{font-family:var(--f-disp); font-weight:600; font-size:1.34rem; line-height:1.14; text-transform:uppercase; margin:0 0 7px}
.paper .authors{font-size:.9rem; color:var(--muted); margin:0}
.paper .authors .me{color:var(--ink); font-weight:600}
.paper .where{font-family:var(--f-mono); font-size:11px; color:var(--muted); margin:5px 0 0}
.paper .pnote{font-family:var(--f-mono); font-size:10.5px; color:var(--accent); margin:6px 0 0; letter-spacing:.04em}
.drawer{display:grid; grid-template-rows:0fr; transition:grid-template-rows .34s var(--ease)}
.drawer.is-open{grid-template-rows:1fr; margin-top:13px}
.drawer-inner{overflow:hidden}
.dbox{position:relative; background:var(--surface); border:1px solid var(--rule); border-left:5px solid var(--accent); padding:16px 17px}
.dbox pre{margin:0; font-family:var(--f-mono); font-size:11px; line-height:1.8; white-space:pre-wrap; word-break:break-word; color:var(--ink)}
.dbox p{margin:0; font-size:.93rem; color:var(--muted); max-width:72ch}
.copy-btn{position:absolute; top:9px; right:9px; font-family:var(--f-mono); font-size:9.5px; letter-spacing:.1em;
  text-transform:uppercase; background:var(--paper); border:1.5px solid var(--rule); color:var(--muted); padding:5px 10px; cursor:pointer}
.copy-btn:hover{color:#fff; background:var(--accent); border-color:var(--accent)}

/* ═══════════ CARDS / AWARDS / TOOLKIT ═══════════ */
.grid{display:grid; grid-template-columns:repeat(auto-fit,minmax(270px,1fr))}
.card{border:1.5px solid var(--rule); padding:24px; margin:0 -1.5px -1.5px 0; display:block; text-decoration:none;
  transition:.25s var(--ease); position:relative; overflow:hidden}
.card::after{content:""; position:absolute; left:0; bottom:0; height:3px; width:100%; background:var(--accent); transform:scaleX(0); transform-origin:left; transition:transform .4s var(--ease)}
.card:hover{border-color:var(--accent); z-index:2; transform:translateY(-4px)}
.card:hover::after{transform:scaleX(1)}
.card h3{font-family:var(--f-disp); font-weight:600; font-size:1.2rem; text-transform:uppercase; line-height:1.1; margin:0 0 10px}
.card p{font-size:.89rem; color:var(--muted); margin:0}
.card .src{font-family:var(--f-mono); font-size:10px; letter-spacing:.1em; text-transform:uppercase; color:var(--accent); margin-top:15px; display:block}
.award{display:grid; grid-template-columns:196px minmax(0,1fr); gap:0 28px; padding:18px 0; border-top:1px solid var(--rule); transition:.25s var(--ease)}
.award:hover{background:var(--surface)}
.award h3{font-family:var(--f-disp); font-weight:600; font-size:1.24rem; text-transform:uppercase; margin:0 0 3px; line-height:1.08}
.award p{font-size:.88rem; color:var(--muted); margin:0}
.kit{display:grid; grid-template-columns:repeat(auto-fit,minmax(240px,1fr)); gap:30px}
.kit h3{font-family:var(--f-mono); font-size:10.5px; letter-spacing:.14em; text-transform:uppercase; color:var(--accent);
  margin:0 0 11px; font-weight:700; padding-bottom:9px; border-bottom:1.5px solid var(--rule)}
.kit p{font-size:.89rem; color:var(--muted); margin:0}

.pager{display:flex; justify-content:flex-end; align-items:center; gap:16px; flex-wrap:wrap;
  border-top:2px solid var(--ink); margin-top:10px; padding:26px 0 0}
.pager a{font-family:var(--f-disp); font-weight:700; font-size:clamp(1.4rem,3.4vw,2.2rem); text-transform:uppercase;
  text-decoration:none; display:flex; align-items:center; gap:14px; transition:.25s var(--ease)}
.pager a:hover{color:var(--accent); gap:26px}
.pager small{display:block; font-family:var(--f-mono); font-size:10px; letter-spacing:.15em; color:var(--muted); margin-bottom:2px}

footer{padding:28px 0 34px; border-top:1px solid var(--rule)}
footer h2{font-family:var(--f-disp); font-weight:700; font-size:clamp(1.35rem,3vw,1.9rem); text-transform:uppercase; line-height:1; margin:0 0 7px}
footer p{color:var(--muted); max-width:52ch; margin:0 0 12px; font-size:11px}
footer .meta-row{gap:8px}
footer .meta-row a{font-size:9px; padding:7px 10px}
footer .colophon{margin-top:16px; font-size:8px}
.colophon{margin-top:56px; padding-top:20px; border-top:2px solid var(--ink); font-family:var(--f-mono); font-size:10.5px;
  letter-spacing:.05em; color:var(--muted); display:flex; justify-content:space-between; flex-wrap:wrap; gap:10px}

.reveal{opacity:0; transform:translateY(20px)}
.reveal.in{opacity:1; transform:none; transition:opacity .65s var(--ease), transform .65s var(--ease)}
@media (prefers-reduced-motion:reduce){
  *{animation:none !important; transition-duration:.01ms !important}
  html{scroll-behavior:auto}
  .reveal,.dim h2,.dim .qty,.dim .cap,.pagehead .kicker,.pagehead .sub,.role,.meta-row{opacity:1; transform:none}
  .pagehead h1 span i{transform:none} .pagehead::before{height:calc(100% - 12px)}
  .dim .ln{transform:scaleX(1)} .tl::before{transform:scaleY(1)} .ticker-track{animation:none}
}
@media (max-width:900px){
  .pagehead{padding-left:24px; padding-right:24px}
  .pagehead::before{left:10px}
  .role{grid-template-columns:1fr}
  .role div{padding:10px 0; border-right:0; border-bottom:1px solid var(--hair)}
  .role div:last-child{border-bottom:0}
  .bio{grid-template-columns:1fr; gap:30px 0}
