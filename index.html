/* ───────────── canvas plumbing ───────────── */
let PAL = {};
function readPalette(){
  const cs = getComputedStyle(document.documentElement), g = n => cs.getPropertyValue(n).trim();
  PAL = { paper:g("--paper"), ink:g("--ink"), muted:g("--muted"), rule:g("--rule"), grid:g("--grid"),
          accent:g("--accent"), blue:g("--blue"), green:g("--green"), gold:g("--gold"), surface:g("--surface") };
}
readPalette();
let SIMS = [];
function killSims(){ SIMS.forEach(s=>s.destroy()); SIMS = []; }
function makeSim(canvas,{ step, draw, resize }){
  const ctx = canvas.getContext("2d");
  let W=0,H=0,running=false,last=0,dead=false;
  function fit(){
    const dpr = Math.min(devicePixelRatio||1,2), r = canvas.getBoundingClientRect();
    W = Math.max(320, r.width||800); H = canvas.height;
    canvas.width = Math.round(W*dpr); canvas.height = Math.round(H*dpr);
    canvas.style.height = H+"px"; ctx.setTransform(dpr,0,0,dpr,0,0);
    if(resize) resize(W,H);
  }
  function frame(t){
    if(!running||dead) return;
    const dt = Math.min(.05,(t-last)/1000||.016); last = t;
    step(dt,W,H); ctx.clearRect(0,0,W,H); draw(ctx,W,H);
    requestAnimationFrame(frame);
  }
  const onResize = ()=>{ fit(); if(!running) once(); };
  function start(){ if(running||dead) return; running=true; last=performance.now(); requestAnimationFrame(frame); }
  function stop(){ running=false; }
  function once(){ if(dead) return; step(.016,W,H); ctx.clearRect(0,0,W,H); draw(ctx,W,H); }
  fit(); addEventListener("resize", onResize);
  const obs = new IntersectionObserver(es=>es.forEach(e=>{
    if(REDUCED){ once(); return; }
    e.isIntersecting ? start() : stop();
  }),{ threshold:.08 });
  obs.observe(canvas); once();
  const api = { start, stop, redraw:once,
    destroy(){ dead=true; running=false; obs.disconnect(); removeEventListener("resize",onResize); } };
  SIMS.push(api); return api;
}
function grid(ctx,W,H,s=26){
  ctx.save(); ctx.strokeStyle=PAL.grid; ctx.lineWidth=1; ctx.beginPath();
  for(let x=0;x<W;x+=s){ ctx.moveTo(x+.5,0); ctx.lineTo(x+.5,H); }
  for(let y=0;y<H;y+=s){ ctx.moveTo(0,y+.5); ctx.lineTo(W,y+.5); }
  ctx.stroke(); ctx.restore();
}
function label(ctx,x,y,t,c,s){
  ctx.save(); ctx.font=`700 ${s||10}px 'Space Mono', monospace`;
  ctx.fillStyle=c||PAL.muted; ctx.fillText(t.toUpperCase(),x,y); ctx.restore();
}

/* ───────────── SIM A · Pure Pursuit + EKF ───────────── */
function navSim(cv, ui){
  let Ld=2.4, sigma=.85, pxPerM=20, path=[];
  let x=0,y=0,th=0; const v=4.2;
  let obias=.02, ex=0, ey=0, P=1; const Q=.35;
  let gpsTimer=0, fixes=[], trail=[], estTrail=[], nG=0, sG=0, sE=0, xte=0;
  function buildPath(w,h){
    const m=46, r=Math.min(70,(h-2*m)/2), x0=m,x1=w-m,y0=m,y1=h-m, pts=[];
    const push=(a,b)=>pts.push({x:a,y:b});
    const arc=(cx,cy,a0,a1)=>{ for(let i=0;i<=26;i++){ const a=a0+(a1-a0)*i/26; push(cx+r*Math.cos(a),cy+r*Math.sin(a)); } };
    const str=(ax,ay,bx,by)=>{ for(let i=0;i<=40;i++) push(ax+(bx-ax)*i/40, ay+(by-ay)*i/40); };
    str(x0+r,y0,x1-r,y0); arc(x1-r,y0+r,-Math.PI/2,Math.PI/2);
    str(x1-r,y1,x0+r,y1); arc(x0+r,y1-r,Math.PI/2,Math.PI*1.5);
    return pts;
  }
  function nearest(px,py){
    let bi=0,bd=Infinity;
    for(let i=0;i<path.length;i++){ const dx=path[i].x-px, dy=path[i].y-py, d=dx*dx+dy*dy; if(d<bd){bd=d;bi=i;} }
    return { i:bi, d:Math.sqrt(bd) };
  }
  function resize(w,h){ path=buildPath(w,h); pxPerM=Math.max(14,w/46);
    if(!trail.length){ x=path[0].x; y=path[0].y; ex=x; ey=y; } }
  function step(dt){
    if(!path.length) return;
    const LdPx=Ld*pxPerM, near=nearest(x,y); xte=near.d/pxPerM;
    let gi=near.i, acc=0;
    while(acc<LdPx){ const a=path[gi], b=path[(gi+1)%path.length];
      acc+=Math.hypot(b.x-a.x,b.y-a.y); gi=(gi+1)%path.length; }
    const goal=path[gi], alpha=Math.atan2(goal.y-y,goal.x-x)-th;
    th += v*pxPerM*(2*Math.sin(alpha)/LdPx)*dt;
    x += v*pxPerM*Math.cos(th)*dt; y += v*pxPerM*Math.sin(th)*dt;
    obias += (gauss()*.004-obias*.01)*dt*60;
    ex += v*pxPerM*Math.cos(th+obias)*dt; ey += v*pxPerM*Math.sin(th+obias)*dt; P += Q*dt;
    gpsTimer += dt;
    if(gpsTimer>.25){
      gpsTimer=0;
      const gx=x+gauss()*sigma*pxPerM, gy=y+gauss()*sigma*pxPerM;
      fixes.push({x:gx,y:gy,a:1}); if(fixes.length>46) fixes.shift();
      const K=P/(P+sigma*sigma);
      ex+=K*(gx-ex); ey+=K*(gy-ey); P*=(1-K);
      nG++; sG+=(Math.hypot(gx-x,gy-y)/pxPerM)**2; sE+=(Math.hypot(ex-x,ey-y)/pxPerM)**2;
      if(nG>400){ nG=200; sG/=2; sE/=2; }
    }
    fixes.forEach(f=>f.a*=.985);
    trail.push({x,y}); if(trail.length>150) trail.shift();
    estTrail.push({x:ex,y:ey}); if(estTrail.length>150) estTrail.shift();
  }
  function poly(ctx,pts,c,wd){
    if(pts.length<2) return;
    ctx.save(); ctx.strokeStyle=c; ctx.lineWidth=wd; ctx.beginPath(); ctx.moveTo(pts[0].x,pts[0].y);
    for(let i=1;i<pts.length;i++) ctx.lineTo(pts[i].x,pts[i].y);
    ctx.stroke(); ctx.restore();
  }
  function draw(ctx,w,h){
    grid(ctx,w,h);
    ctx.save(); ctx.strokeStyle=PAL.rule; ctx.lineWidth=1.5; ctx.setLineDash([7,6]);
    ctx.beginPath(); ctx.moveTo(path[0].x,path[0].y); path.forEach(p=>ctx.lineTo(p.x,p.y));
    ctx.closePath(); ctx.stroke(); ctx.restore();
    fixes.forEach(f=>{ ctx.save(); ctx.globalAlpha=Math.max(0,f.a)*.8;
      ctx.strokeStyle=PAL.blue; ctx.lineWidth=1.2; ctx.beginPath();
      ctx.moveTo(f.x-3,f.y); ctx.lineTo(f.x+3,f.y); ctx.moveTo(f.x,f.y-3); ctx.lineTo(f.x,f.y+3);
      ctx.stroke(); ctx.restore(); });
    poly(ctx,trail,PAL.muted,1.2); poly(ctx,estTrail,PAL.accent,2);
    ctx.save(); ctx.strokeStyle=PAL.accent; ctx.globalAlpha=.3; ctx.setLineDash([3,4]);
    ctx.beginPath(); ctx.arc(x,y,Ld*pxPerM,0,Math.PI*2); ctx.stroke(); ctx.restore();
    ctx.save(); ctx.translate(x,y); ctx.rotate(th);
    ctx.fillStyle=PAL.ink; ctx.fillRect(-11,-8,22,16);
    ctx.fillStyle=PAL.accent; ctx.fillRect(7,-8,4,16);
    ctx.fillStyle=PAL.muted; [[-9,-11],[5,-11],[-9,7],[5,7]].forEach(([a,b])=>ctx.fillRect(a,b,5,4));
    ctx.restore();
    label(ctx,14,22,"— truth",PAL.muted); label(ctx,14,38,"+ raw gps",PAL.blue); label(ctx,14,54,"— ekf estimate",PAL.accent);
    ui.xte.textContent = xte.toFixed(2)+" m";
    if(nG>12) ui.red.textContent = "−"+Math.max(0,(1-Math.sqrt(sE/nG)/Math.sqrt(sG/nG))*100).toFixed(1)+"%";
  }
  const sim = makeSim(cv,{ step, draw, resize });
  ui.sLd.addEventListener("input", e=>{ Ld=+e.target.value; ui.vLd.textContent=Ld.toFixed(1); sim.redraw(); });
  ui.sSig.addEventListener("input", e=>{ sigma=+e.target.value; ui.vSig.textContent=sigma.toFixed(2); nG=sG=sE=0; sim.redraw(); });
}

/* ───────────── SIM B · quarter-car ───────────── */
function suspensionSim(root){
  const cv = root.querySelector(".cv");
  let pressure=4.2, rough=1, W=0, H=0, scroll=0; const M=260;
  const carts=[{name:"baseline",k:9500,c:620,z:0,dz:0,rms:0,n:1,sum:0,tuned:false},
               {name:"tuned",k:0,c:0,z:0,dz:0,rms:0,n:1,sum:0,tuned:true}];
  const terrain = t => (Math.sin(t*.031)*15+Math.sin(t*.084+1.3)*8+Math.sin(t*.191+2.7)*4.5)*rough;
  function resize(w,h){ W=w; H=h; }
  function step(dt){
    scroll += 78*dt;
    carts[1].k = 3600+pressure*1450; carts[1].c = 900+pressure*90;
    carts.forEach((c,i)=>{
      const xPos = i===0?W*.27:W*.72, defl = c.z-terrain(scroll+xPos);
      const damp = c.dz>0?c.c*1.35:c.c;
      let F = -c.k*defl-damp*c.dz;
      if(defl>26) F -= (defl-26)*26000;
      if(defl<-26) F -= (defl+26)*26000;
      const acc = F/M; c.dz += acc*dt; c.z += c.dz*dt;
      c.sum += acc*acc; c.n++;
      if(c.n>900){ c.sum*=.5; c.n=Math.round(c.n/2); }
      c.rms = Math.sqrt(c.sum/c.n);
    });
  }
  function draw(ctx,w,h){
    grid(ctx,w,h); const base=h-58;
    ctx.save(); ctx.beginPath(); ctx.moveTo(0,h);
    for(let px=0;px<=w;px+=3) ctx.lineTo(px,base-terrain(scroll+px));
    ctx.lineTo(w,h); ctx.closePath(); ctx.fillStyle=PAL.grid; ctx.fill();
    ctx.strokeStyle=PAL.rule; ctx.lineWidth=1.5; ctx.beginPath();
    for(let px=0;px<=w;px+=3){ const ty=base-terrain(scroll+px); px?ctx.lineTo(px,ty):ctx.moveTo(px,ty); }
    ctx.stroke(); ctx.restore();
    carts.forEach((c,i)=>{
      const xPos = i===0?w*.27:w*.72;
      const wheelY = base-terrain(scroll+xPos)-12, bodyY = base-96-c.z*.55;
      const col = c.tuned?PAL.accent:PAL.muted;
      ctx.save(); ctx.strokeStyle=col; ctx.lineWidth=c.tuned?2:1.4; ctx.globalAlpha=c.tuned?1:.6;
      ctx.beginPath(); const span=wheelY-bodyY-8; ctx.moveTo(xPos,bodyY+8);
      for(let s=1;s<=8;s++) ctx.lineTo(xPos+(s%2?9:-9),bodyY+8+span*s/8);
      ctx.lineTo(xPos,wheelY); ctx.stroke();
      ctx.fillStyle=col; ctx.lineWidth=2; ctx.beginPath(); ctx.rect(xPos-42,bodyY-16,84,24);
      c.tuned?ctx.fill():ctx.stroke();
      ctx.beginPath(); ctx.arc(xPos,wheelY,12,0,Math.PI*2); ctx.lineWidth=2.4; ctx.stroke(); ctx.restore();
      label(ctx,xPos-42,bodyY-26,c.name,col);
    });
    root.querySelector(".gB").textContent = carts[0].rms.toFixed(2)+" m/s²";
    const d = (1-carts[1].rms/carts[0].rms)*100;
    root.querySelector(".gT").textContent = carts[1].rms.toFixed(2)+" m/s²"+
      (isFinite(d)?`  (${d>0?"−":"+"}${Math.abs(d).toFixed(1)}%)`:"");
  }
  const sim = makeSim(cv,{ step, draw, resize });
  const clr = ()=>carts.forEach(c=>{ c.sum=0; c.n=1; });
  root.querySelector(".sP").addEventListener("input", e=>{ pressure=+e.target.value; root.querySelector(".vP").textContent=pressure.toFixed(1); clr(); sim.redraw(); });
  root.querySelector(".sR").addEventListener("input", e=>{ rough=+e.target.value; root.querySelector(".vR").textContent=rough.toFixed(1); clr(); sim.redraw(); });
}

/* ───────────── SIM C · point cloud ───────────── */
function cloudSim(root){
  const cv = root.querySelector(".cv");
  let cut=.18, yaw=.6, dragging=false, lastX=0, auto=true;
  const pts=[];
  (function build(){
    // Dense ground/reference layer
    for(let i=0;i<2400;i++){
      const r=Math.sqrt(Math.random())*1.38, a=Math.random()*Math.PI*2;
      pts.push({
        x:Math.cos(a)*r + gauss()*.012,
        y:Math.max(0,Math.random()*.11 + gauss()*.006),
        z:Math.sin(a)*r + gauss()*.012
      });
    }

    // More canopy centres + substantially more samples for a denser live cloud.
    const centres=[];
    for(let b=0;b<14;b++){
      const ring=.12+Math.random()*.58;
      const a=Math.random()*Math.PI*2;
      centres.push({
        x:Math.cos(a)*ring,
        y:.30+Math.random()*.86,
        z:Math.sin(a)*ring
      });
    }

    for(let i=0;i<6600;i++){
      const c=centres[(Math.random()*centres.length)|0];
      const sy=c.y+gauss()*.16;
      if(sy<.10) continue;

      // Slightly anisotropic foliage clusters create a fuller canopy silhouette.
      pts.push({
        x:c.x+gauss()*(.13+Math.random()*.055),
        y:sy,
        z:c.z+gauss()*(.13+Math.random()*.055)
      });
    }

    // Central stems / lower woody structure.
    for(let i=0;i<360;i++){
      const y=.05+Math.random()*.55;
      const spread=.016+.020*(y/.55);
      pts.push({
        x:gauss()*spread,
        y,
        z:gauss()*spread
      });
    }
  })();
  const maxY = pts.reduce((m,p)=>Math.max(m,p.y),0);
  function step(dt){ if(auto&&!dragging) yaw += dt*.34; }
  function draw(ctx,w,h){
    grid(ctx,w,h);
    const cx=w/2, cy=h*.82, S=Math.min(h*.62,w*.3);
    const cosY=Math.cos(yaw), sinY=Math.sin(yaw), tilt=.42;
    const proj = pts.map(p=>{
      const rx=p.x*cosY-p.z*sinY, rz=p.x*sinY+p.z*cosY;
      const depth=rz*Math.cos(tilt)+p.y*Math.sin(tilt), ps=1/(1+depth*.16);
      return { sx:cx+rx*S*ps, sy:cy-(p.y*Math.cos(tilt)-rz*Math.sin(tilt))*S*ps, d:depth, y:p.y, keep:p.y>cut, ps };
    }).sort((a,b)=>b.d-a.d);
    let kept=0,topY=0,spread=0;
    proj.forEach(p=>{
      if(p.keep){
        kept++; topY=Math.max(topY,p.y); spread=Math.max(spread,Math.abs(p.sx-cx));
        const t=Math.min(1,(p.y-cut)/Math.max(.2,maxY-cut));
        ctx.fillStyle = t>.62?PAL.accent:(t>.3?PAL.green:PAL.blue);
        ctx.globalAlpha=.48+p.ps*.38; ctx.fillRect(p.sx,p.sy,1.65,1.65);
      } else { ctx.fillStyle=PAL.rule; ctx.globalAlpha=.38; ctx.fillRect(p.sx,p.sy,1.25,1.25); }
    });
    ctx.globalAlpha=1;
    const planeY = cy-cut*Math.cos(tilt)*S;
    ctx.save(); ctx.strokeStyle=PAL.accent; ctx.lineWidth=1.5; ctx.setLineDash([6,5]);
    ctx.beginPath(); ctx.moveTo(cx-S*1.5,planeY); ctx.lineTo(cx+S*1.5,planeY); ctx.stroke(); ctx.restore();
    label(ctx,14,22,"canopy retained",PAL.accent); label(ctx,14,38,"ground removed",PAL.rule);
    const hM=Math.max(0,topY-cut), rM=spread/S;
    root.querySelector(".gN").textContent = kept.toLocaleString();
    root.querySelector(".gH").textContent = hM.toFixed(2)+" m";
    root.querySelector(".gV").textContent = (Math.PI*rM*rM*hM*.62).toFixed(3)+" m³";
  }
  const sim = makeSim(cv,{ step, draw, resize:()=>{} });
  root.querySelector(".sG").addEventListener("input", e=>{ cut=+e.target.value; root.querySelector(".vG").textContent=cut.toFixed(2); sim.redraw(); });
  const down = e=>{ dragging=true; auto=false; lastX=(e.touches?e.touches[0]:e).clientX; };
  const move = e=>{ if(!dragging) return; const c=(e.touches?e.touches[0]:e).clientX; yaw+=(c-lastX)*.011; lastX=c; sim.redraw(); };
  const up = ()=>{ dragging=false; setTimeout(()=>(auto=true),2200); };
  cv.addEventListener("mousedown",down); cv.addEventListener("touchstart",down,{passive:true});
  addEventListener("mousemove",move); addEventListener("touchmove",move,{passive:true});
  addEventListener("mouseup",up); addEventListener("touchend",up);
}

/* ───────────── SIM D · thesis navigation: manual vs autonomous ───────────── */
function motionNavSim(root){
  const cv = root.querySelector(".cv");
  let W=0,H=0,path=[],mode="auto",speed=.75;
  let x=0,y=0,th=0,trail=[],xte=0,ready=false;
  const keys={up:false,down:false,left:false,right:false};
  const q = sel => root.querySelector(sel);

  function buildPath(w,h){
    const way=[
      [.08,.80],[.09,.22],[.24,.11],[.42,.24],
      [.30,.45],[.43,.68],[.62,.58],[.57,.35],
      [.73,.16],[.90,.28],[.83,.50],[.92,.73],
      [.74,.88],[.53,.76],[.34,.89],[.15,.80]
    ].map(([nx,ny])=>({x:nx*w,y:ny*h}));
    const pts=[], n=way.length, samples=18;
    const at=i=>way[(i+n)%n];
    for(let i=0;i<n;i++){
      const p0=at(i-1), p1=at(i), p2=at(i+1), p3=at(i+2);
      for(let j=0;j<samples;j++){
        const t=j/samples, t2=t*t, t3=t2*t;
        pts.push({
          x:.5*((2*p1.x)+(-p0.x+p2.x)*t+(2*p0.x-5*p1.x+4*p2.x-p3.x)*t2+(-p0.x+3*p1.x-3*p2.x+p3.x)*t3),
          y:.5*((2*p1.y)+(-p0.y+p2.y)*t+(2*p0.y-5*p1.y+4*p2.y-p3.y)*t2+(-p0.y+3*p1.y-3*p2.y+p3.y)*t3)
        });
      }
    }
    pts.push({...pts[0]});
    return pts;
  }
  function nearest(px,py){
    let bi=0,bd=Infinity;
    for(let i=0;i<path.length;i++){
      const dx=path[i].x-px,dy=path[i].y-py,d=dx*dx+dy*dy;
      if(d<bd){bd=d;bi=i;}
    }
    return {i:bi,d:Math.sqrt(bd)};
  }
  function reset(){
    if(!path.length) return;
    x=path[0].x; y=path[0].y; th=Math.atan2(path[1].y-path[0].y,path[1].x-path[0].x); trail=[]; xte=0;
  }
  function resize(w,h){
    W=w; H=h; path=buildPath(w,h);
    if(!ready){ reset(); ready=true; }
    else { x=Math.min(Math.max(x,20),w-20); y=Math.min(Math.max(y,20),h-20); }
  }
  function wrap(a){ while(a>Math.PI)a-=2*Math.PI; while(a<-Math.PI)a+=2*Math.PI; return a; }
  function step(dt){
    if(!path.length) return;
    const near=nearest(x,y); xte=near.d/Math.max(18,W/48);
    const v=55+speed*55;
    if(mode==="auto"){
      const look=Math.max(9,Math.round(12+speed*10));
      const goal=path[(near.i+look)%path.length];
      const desired=Math.atan2(goal.y-y,goal.x-x);
      const err=wrap(desired-th);
      th += Math.max(-1.35,Math.min(1.35,err*2.4))*dt;
      x += v*Math.cos(th)*dt; y += v*Math.sin(th)*dt;
    } else {
      const turn=(keys.left?1:0)-(keys.right?1:0);
      const drive=(keys.up?1:0)-(keys.down?1:0);
      th -= turn*1.85*dt;
      x += drive*v*Math.cos(th)*dt; y += drive*v*Math.sin(th)*dt;
    }
    x=Math.min(Math.max(x,18),W-18); y=Math.min(Math.max(y,18),H-18);
    trail.push({x,y}); if(trail.length>260) trail.shift();
  }
  function drawPlants(ctx,w,h){
    const ys=[58,58+(h-116)/3,58+2*(h-116)/3,h-58];
    ctx.save();
    ys.forEach((yy,row)=>{
      for(let px=35;px<w-20;px+=30){
        if(px>45 && px<w-45){
          ctx.fillStyle=row%2?PAL.green:PAL.muted; ctx.globalAlpha=.24;
          ctx.beginPath(); ctx.arc(px,yy+(row%2?18:-18),3.2,0,Math.PI*2); ctx.fill();
        }
      }
    });
    ctx.restore();
  }
  function draw(ctx,w,h){
    grid(ctx,w,h); drawPlants(ctx,w,h);
    // High-contrast route halo, then an accent dashed reference path.
    ctx.save();
    ctx.strokeStyle=PAL.paper; ctx.lineWidth=8; ctx.lineJoin="round"; ctx.lineCap="round";
    ctx.beginPath(); ctx.moveTo(path[0].x,path[0].y); for(let i=1;i<path.length;i++)ctx.lineTo(path[i].x,path[i].y); ctx.stroke();
    ctx.strokeStyle=PAL.accent; ctx.globalAlpha=.95; ctx.lineWidth=2.8; ctx.setLineDash([11,6]);
    ctx.beginPath(); ctx.moveTo(path[0].x,path[0].y); for(let i=1;i<path.length;i++)ctx.lineTo(path[i].x,path[i].y); ctx.stroke();
    ctx.restore();

    // Route markers make the path readable even on a small screen.
    ctx.save(); ctx.fillStyle=PAL.accent; ctx.strokeStyle=PAL.paper; ctx.lineWidth=2;
    for(let i=0;i<path.length-1;i+=36){ ctx.beginPath(); ctx.arc(path[i].x,path[i].y,3.6,0,Math.PI*2); ctx.fill(); ctx.stroke(); }
    ctx.restore();

    if(trail.length>1){ ctx.save(); ctx.strokeStyle=PAL.blue; ctx.globalAlpha=.9; ctx.lineWidth=2; ctx.beginPath(); ctx.moveTo(trail[0].x,trail[0].y); trail.forEach(p=>ctx.lineTo(p.x,p.y)); ctx.stroke(); ctx.restore(); }

    const near=nearest(x,y), ref=path[near.i];
    const look=Math.max(9,Math.round(12+speed*10)), goal=path[(near.i+look)%path.length];
    ctx.save(); ctx.strokeStyle=PAL.accent; ctx.globalAlpha=.48; ctx.setLineDash([3,4]); ctx.beginPath(); ctx.moveTo(x,y); ctx.lineTo(ref.x,ref.y); ctx.stroke(); ctx.restore();
    if(mode==="auto"){
      ctx.save(); ctx.strokeStyle=PAL.gold; ctx.fillStyle=PAL.paper; ctx.lineWidth=2;
      ctx.beginPath(); ctx.arc(goal.x,goal.y,6,0,Math.PI*2); ctx.fill(); ctx.stroke(); ctx.restore();
    }
    label(ctx,path[0].x+8,path[0].y-10,"START",PAL.accent,9);
    ctx.save(); ctx.translate(x,y); ctx.rotate(th);
    ctx.fillStyle=PAL.ink; ctx.fillRect(-13,-9,26,18);
    ctx.fillStyle=PAL.accent; ctx.fillRect(8,-9,5,18);
    ctx.fillStyle=PAL.muted; [[-11,-13],[6,-13],[-11,9],[6,9]].forEach(([a,b])=>ctx.fillRect(a,b,6,4));
    ctx.restore();
    label(ctx,14,22,mode==="auto"?"AUTONOMOUS · PATH FOLLOWING":"MANUAL · ARROW KEYS / WASD",mode==="auto"?PAL.accent:PAL.blue);
    label(ctx,14,40,"RED DASH = REFERENCE · BLUE = ROBOT TRAIL · GOLD = LOOKAHEAD",PAL.muted,9);
    q(".gMode").textContent=mode==="auto"?"AUTONOMOUS":"MANUAL";
    q(".gXte").textContent=xte.toFixed(2)+" m";
  }

  const sim=makeSim(cv,{step,draw,resize});
  const setMode=m=>{
    mode=m;
    q(".navAuto").classList.toggle("is-active",m==="auto");
    q(".navManual").classList.toggle("is-active",m==="manual");
    q(".drive-pad").style.opacity=m==="manual"?"1":".35";
    sim.redraw();
  };
  q(".navAuto").addEventListener("click",()=>setMode("auto"));
  q(".navManual").addEventListener("click",()=>setMode("manual"));
  q(".navReset").addEventListener("click",()=>{reset();sim.redraw();});
  q(".sSpeed").addEventListener("input",e=>{speed=+e.target.value;q(".vSpeed").textContent=speed.toFixed(2);});

  const mapKey=(k,on)=>{
    const key=k.toLowerCase();
    if(key==="arrowup"||key==="w")keys.up=on;
    if(key==="arrowdown"||key==="s")keys.down=on;
    if(key==="arrowleft"||key==="a")keys.left=on;
    if(key==="arrowright"||key==="d")keys.right=on;
  };
  const keyDown=e=>{ if(mode!=="manual")return; if(["arrowup","arrowdown","arrowleft","arrowright","w","a","s","d"].includes(e.key.toLowerCase())){e.preventDefault();mapKey(e.key,true);} };
  const keyUp=e=>mapKey(e.key,false);
  addEventListener("keydown",keyDown); addEventListener("keyup",keyUp);

  root.querySelectorAll(".drive-btn").forEach(btn=>{
    const dir=btn.dataset.dir;
    const press=e=>{ if(mode!=="manual")return; e.preventDefault(); keys[dir]=true; btn.classList.add("pressed"); };
    const release=()=>{ keys[dir]=false; btn.classList.remove("pressed"); };
    btn.addEventListener("pointerdown",press); btn.addEventListener("pointerup",release); btn.addEventListener("pointercancel",release); btn.addEventListener("pointerleave",release);
  });
  const baseDestroy=sim.destroy.bind(sim);
  sim.destroy=()=>{ removeEventListener("keydown",keyDown); removeEventListener("keyup",keyUp); baseDestroy(); };
  setMode("auto");
}

/* ───────────── 2D AUTONOMY EXPLORER ───────────── */
function roboticsLearning(root){
  const cv=root.querySelector("#autoCanvas"), q=s=>root.querySelector(s);

  const STYLES=[
    {id:"balanced",name:"Balanced",speed:1.00,gain:1.00,look:1.00,safety:1.00,desc:"A balanced setting between speed, smoothness and responsiveness."},
    {id:"precise",name:"Precise",speed:.76,gain:1.38,look:.72,safety:1.20,desc:"Slower motion with stronger correction for accurate tracking."},
    {id:"smooth",name:"Smooth",speed:.88,gain:.78,look:1.48,safety:1.05,desc:"Uses gentler steering and a longer look-ahead for smoother motion."},
    {id:"fast",name:"Fast",speed:1.34,gain:1.05,look:1.08,safety:.90,desc:"Prioritizes speed while keeping the same autonomy objective."},
    {id:"cautious",name:"Cautious",speed:.62,gain:1.18,look:.88,safety:1.55,desc:"Moves slowly and reacts earlier to obstacles and uncertainty."},
    {id:"adaptive",name:"Adaptive",speed:1.00,gain:1.14,look:1.15,safety:1.20,desc:"Changes speed and steering strength as the situation changes."},
    {id:"short",name:"Short-Horizon",speed:.90,gain:1.28,look:.58,safety:1.05,desc:"Looks only a short distance ahead and reacts quickly to local changes."},
    {id:"long",name:"Long-Horizon",speed:1.02,gain:.88,look:1.80,safety:1.10,desc:"Looks farther ahead, producing broader and smoother decisions."},
    {id:"eco",name:"Energy-Saver",speed:.68,gain:.90,look:1.28,safety:1.15,desc:"Uses lower speed and gentler steering to represent energy-aware autonomy."},
    {id:"robust",name:"Robust",speed:.84,gain:1.46,look:.95,safety:1.35,desc:"Uses stronger correction to represent operation with disturbance or noisy sensing."}
  ];

  const FAMILIES=[
    {id:"path",name:"Path Following",sensor:"Path + heading",desc:"Follow a curved reference route from start to finish.",watch:"Compare the red reference path with the blue robot trail."},
    {id:"waypoint",name:"Waypoint Navigation",sensor:"Position + heading",desc:"Visit a sequence of navigation waypoints in order.",watch:"Watch the active waypoint move as the robot reaches each point."},
    {id:"avoid",name:"Obstacle Avoidance",sensor:"Range sensing",desc:"Move toward the goal while steering away from nearby obstacles.",watch:"Sensor rays and avoidance arcs become more visible near obstacles."},
    {id:"tracking",name:"Moving Target Tracking",sensor:"Target position",desc:"Continuously follow a moving target while keeping a useful stand-off distance.",watch:"The green target moves while the robot predicts and follows it."},
    {id:"patrol",name:"Patrol Route",sensor:"Position + checkpoints",desc:"Repeat a patrol through several inspection checkpoints.",watch:"Checkpoint markers activate one after another."},
    {id:"coverage",name:"Area Coverage",sensor:"Position + map",desc:"Systematically sweep an area using a back-and-forth coverage pattern.",watch:"The robot paints a structured coverage trail across the workspace."},
    {id:"perimeter",name:"Perimeter Inspection",sensor:"Boundary distance",desc:"Travel around the edge of a defined inspection region.",watch:"The robot keeps a consistent distance from the boundary."},
    {id:"dock",name:"Precision Docking",sensor:"Relative dock pose",desc:"Approach a docking station and slow down for final alignment.",watch:"Speed drops during the final docking approach."},
    {id:"home",name:"Return-to-Home",sensor:"Home position",desc:"Return from a remote operating point to a fixed home position.",watch:"The robot first operates away from home, then autonomously returns."},
    {id:"corridor",name:"Corridor Navigation",sensor:"Left/right range",desc:"Stay centered while travelling through a constrained corridor.",watch:"Left and right sensor distances are drawn beside the robot."},
    {id:"search",name:"Search Pattern",sensor:"Position + search map",desc:"Search a region using an expanding autonomous sweep.",watch:"The search route gradually covers more of the workspace."},
    {id:"adaptive",name:"Adaptive Speed Navigation",sensor:"Path + obstacle + curvature",desc:"Follow a route while automatically changing speed for turns and obstacles.",watch:"The live speed changes according to path curvature and obstacle proximity."}
  ];

  const MODES=[];
  FAMILIES.forEach((f,fi)=>{
    STYLES.forEach((s,si)=>{
      MODES.push({
        id:`${f.id}_${s.id}`,
        family:f,
        style:s,
        familyIndex:fi,
        styleIndex:si,
        label:`${f.name} · ${s.name}`
      });
    });
  });

  const DEMO_DURATION=40;
  let W=0,H=0,t=0;
  let state="idle";
  let elapsed=0;
  let mode=MODES[0];
  let showSensors=true;
  let showTrail=true;

  // Visitor tuning overrides. These start from the selected mode's style
  // and can be changed live while the simulation is running.
  let tuneSpeed=1.0;
  let tuneGain=1.0;
  let tuneLook=1.0;
  let tuneDisturbance=0.0;

  // Error history lets visitors compare tuning choices.
  let errorSum=0;
  let errorSamples=0;
  let errorMax=0;

  let robot={x:0,y:0,th:0,v:0,trail:[],index:0,wp:0,error:0};
  let target={x:0,y:0};
  let route=[];
  let waypoints=[];
  let obstacles=[];
  let home={x:0,y:0};
  let dock={x:0,y:0};

  function clamp(v,a,b){return Math.max(a,Math.min(b,v));}
  function wrap(a){while(a>Math.PI)a-=Math.PI*2;while(a<-Math.PI)a+=Math.PI*2;return a;}

  // Simulated physical scale: the displayed arena is treated as 12 m wide.
  // Pixel geometry is converted to meters only for visitor-facing metrics.
  const ARENA_WIDTH_M=12;
  function metersPerPixel(){ return ARENA_WIDTH_M/Math.max(1,W); }
  function pxToMeters(px){ return px*metersPerPixel(); }
  function speedMetersPerSecond(){ return robot.v*metersPerPixel(); }

  function catmull(points,steps=24,closed=false){
    const out=[];
    const n=points.length;
    const get=i=>{
      if(closed)return points[(i+n)%n];
      return points[Math.max(0,Math.min(n-1,i))];
    };
    const end=closed?n:n-1;

    for(let i=0;i<end;i++){
      const p0=get(i-1),p1=get(i),p2=get(i+1),p3=get(i+2);
      for(let j=0;j<steps;j++){
        const u=j/steps,u2=u*u,u3=u2*u;
        out.push({
          x:.5*((2*p1.x)+(-p0.x+p2.x)*u+(2*p0.x-5*p1.x+4*p2.x-p3.x)*u2+(-p0.x+3*p1.x-3*p2.x+p3.x)*u3),
          y:.5*((2*p1.y)+(-p0.y+p2.y)*u+(2*p0.y-5*p1.y+4*p2.y-p3.y)*u2+(-p0.y+3*p1.y-3*p2.y+p3.y)*u3)
        });
      }
    }
    if(!closed)out.push(points[n-1]);
    return out;
  }

  function buildScene(){
    home={x:W*.10,y:H*.83};
    dock={x:W*.89,y:H*.79};

    const base=[
      [0.08,0.78],[0.16,0.78],[0.26,0.67],[0.22,0.47],
      [0.34,0.29],[0.49,0.31],[0.58,0.48],[0.69,0.57],
      [0.78,0.45],[0.88,0.27],[0.93,0.18]
    ].map(([x,y])=>({x:x*W,y:y*H}));
    route=catmull(base,28,false);

    waypoints=[
      {x:W*.15,y:H*.76},
      {x:W*.30,y:H*.25},
      {x:W*.52,y:H*.32},
      {x:W*.70,y:H*.68},
      {x:W*.88,y:H*.26}
    ];

    obstacles=[
      {x:W*.37,y:H*.46,r:24},
      {x:W*.61,y:H*.36,r:28},
      {x:W*.74,y:H*.63,r:24}
    ];
  }

  function resetTuningFromMode(){
    // Normalize each mode's built-in style into visitor-facing tuning values.
    tuneSpeed=mode.style.speed;
    tuneGain=mode.style.gain;
    tuneLook=mode.style.look;
    tuneDisturbance=0.0;
    syncTuningControls();
  }

  function syncTuningControls(){
    const speed=q("#tuneSpeed");
    const gain=q("#tuneGain");
    const look=q("#tuneLook");
    const disturb=q("#tuneDisturbance");
    if(speed)speed.value=tuneSpeed;
    if(gain)gain.value=tuneGain;
    if(look)look.value=tuneLook;
    if(disturb)disturb.value=tuneDisturbance;
  }

  function resetErrorStats(){
    errorSum=0;
    errorSamples=0;
    errorMax=0;
  }

  function resetRobot(){
    buildScene();
    elapsed=0;
    state="idle";
    robot={
      x:W*.09,y:H*.78,th:0,v:0,trail:[],
      index:0,wp:0,error:0
    };
    target={x:W*.75,y:H*.35};
    resetErrorStats();

    if(mode.family.id==="dock"){
      robot.x=W*.12;robot.y=H*.24;robot.th=.15;
    }else if(mode.family.id==="home"){
      robot.x=W*.80;robot.y=H*.22;robot.th=2.6;
    }else if(mode.family.id==="corridor"){
      robot.x=W*.10;robot.y=H*.52;robot.th=0;
    }

    updateUI();
  }

  function resize(w,h){
    W=w;H=h;
    resetRobot();
  }

  function steerToward(x,y,gain,dt){
    const desired=Math.atan2(y-robot.y,x-robot.x);
    const e=wrap(desired-robot.th);
    robot.th+=clamp(e*gain,-2.8,2.8)*dt;
    return Math.abs(e);
  }

  function advance(speed,dt){
    robot.v+=(speed-robot.v)*Math.min(1,dt*3.5);
    robot.x+=Math.cos(robot.th)*robot.v*dt;
    robot.y+=Math.sin(robot.th)*robot.v*dt;
    robot.x=clamp(robot.x,13,W-13);
    robot.y=clamp(robot.y,13,H-13);

    if(showTrail){
      robot.trail.push({x:robot.x,y:robot.y});
      if(robot.trail.length>330)robot.trail.shift();
    }
  }

  function nearestRouteIndex(){
    let bi=robot.index,bd=Infinity;
    const start=Math.max(0,robot.index-4);
    const stop=Math.min(route.length,robot.index+70);
    for(let i=start;i<stop;i++){
      const d=Math.hypot(robot.x-route[i].x,robot.y-route[i].y);
      if(d<bd){bd=d;bi=i;}
    }
    robot.index=Math.max(robot.index,bi);
    robot.error=bd;
    return bi;
  }

  function followRoute(dt,speedMul=1,gainMul=1,lookMul=1){
    const idx=nearestRouteIndex();
    const look=Math.round(10*tuneLook*lookMul);
    const p=route[Math.min(route.length-1,idx+look)];
    steerToward(p.x,p.y,3.2*tuneGain*gainMul,dt);
    advance(44*tuneSpeed*speedMul,dt);
  }

  function obstacleVector(){
    let rx=0,ry=0,nearest=999;
    obstacles.forEach(o=>{
      const dx=robot.x-o.x,dy=robot.y-o.y;
      const d=Math.max(1,Math.hypot(dx,dy)-o.r);
      nearest=Math.min(nearest,d);
      const range=115*mode.style.safety;
      if(d<range){
        const w=(range-d)/range;
        rx+=dx/Math.max(1,Math.hypot(dx,dy))*w;
        ry+=dy/Math.max(1,Math.hypot(dx,dy))*w;
      }
    });
    return {x:rx,y:ry,nearest};
  }

  function familyStep(dt){
    const f=mode.family.id;

    if(f==="path"){
      followRoute(dt);
    }

    else if(f==="waypoint"){
      const p=waypoints[robot.wp%waypoints.length];
      const err=steerToward(p.x,p.y,3.0*tuneGain,dt);
      advance(42*tuneSpeed*(1-.25*Math.min(1,err)),dt);
      if(Math.hypot(robot.x-p.x,robot.y-p.y)<25)robot.wp=(robot.wp+1)%waypoints.length;
    }

    else if(f==="avoid"){
      const goal={x:W*.91,y:H*.22};
      const rep=obstacleVector();
      const gx=goal.x-robot.x,gy=goal.y-robot.y;
      const tx=robot.x+gx*.45+rep.x*135*mode.style.safety;
      const ty=robot.y+gy*.45+rep.y*135*mode.style.safety;
      steerToward(tx,ty,3.2*tuneGain,dt);
      const slow=rep.nearest<70?0.55:1;
      advance(43*tuneSpeed*slow,dt);
    }

    else if(f==="tracking"){
      const a=elapsed*.36;
      target.x=W*.60+Math.cos(a)*W*.22;
      target.y=H*.48+Math.sin(a*1.35)*H*.20;
      const dx=target.x-robot.x,dy=target.y-robot.y;
      const d=Math.max(1,Math.hypot(dx,dy));
      const stand=62+tuneLook*15;
      const tx=target.x-dx/d*stand;
      const ty=target.y-dy/d*stand;
      steerToward(tx,ty,3.1*tuneGain,dt);
      advance(45*tuneSpeed*(d<stand*.8?.45:1),dt);
    }

    else if(f==="patrol"){
      const patrol=[
        {x:W*.18,y:H*.22},{x:W*.82,y:H*.22},
        {x:W*.82,y:H*.75},{x:W*.18,y:H*.75}
      ];
      const p=patrol[robot.wp%patrol.length];
      steerToward(p.x,p.y,3.0*tuneGain,dt);
      advance(40*tuneSpeed,dt);
      if(Math.hypot(robot.x-p.x,robot.y-p.y)<25)robot.wp=(robot.wp+1)%patrol.length;
    }

    else if(f==="coverage"){
      const rows=7;
      const pts=[];
      for(let r=0;r<rows;r++){
        const y=H*(.16+r*.105);
        if(r%2===0){
          pts.push({x:W*.14,y},{x:W*.86,y});
        }else{
          pts.push({x:W*.86,y},{x:W*.14,y});
        }
      }
      const p=pts[robot.wp%pts.length];
      steerToward(p.x,p.y,3.3*tuneGain,dt);
      advance(36*tuneSpeed,dt);
      if(Math.hypot(robot.x-p.x,robot.y-p.y)<22)robot.wp=(robot.wp+1)%pts.length;
    }

    else if(f==="perimeter"){
      const pad=54*tuneLook;
      const pts=[
        {x:pad,y:pad},{x:W-pad,y:pad},
        {x:W-pad,y:H-pad},{x:pad,y:H-pad}
      ];
      const p=pts[robot.wp%4];
      steerToward(p.x,p.y,3.3*tuneGain,dt);
      advance(38*tuneSpeed,dt);
      if(Math.hypot(robot.x-p.x,robot.y-p.y)<24)robot.wp=(robot.wp+1)%4;
    }

    else if(f==="dock"){
      const staging={x:dock.x-115,y:dock.y};
      const dDock=Math.hypot(robot.x-dock.x,robot.y-dock.y);
      const p=dDock>120?staging:dock;
      steerToward(p.x,p.y,3.5*tuneGain,dt);
      const slow=dDock<130?clamp(dDock/130,.20,1):1;
      advance(38*tuneSpeed*slow,dt);
      if(dDock<18)robot.v=0;
    }

    else if(f==="home"){
      const away={x:W*.78,y:H*.20};
      const goHome=elapsed>4.0;
      const p=goHome?home:away;
      steerToward(p.x,p.y,3.2*tuneGain,dt);
      const d=Math.hypot(robot.x-p.x,robot.y-p.y);
      advance(39*tuneSpeed*(d<55?.45:1),dt);
    }

    else if(f==="corridor"){
      const centerY=H*.52;
      const phase=(robot.x/W)*Math.PI*2;
      const desiredY=centerY+Math.sin(phase*1.5)*28;
      const targetX=Math.min(W-35,robot.x+90*tuneLook);
      steerToward(targetX,desiredY,3.1*tuneGain,dt);
      advance(40*tuneSpeed,dt);
      if(robot.x>W-38){robot.x=42;robot.y=centerY;robot.trail=[];}
    }

    else if(f==="search"){
      const cx=W*.5,cy=H*.5;
      const a=elapsed*.82;
      const rad=Math.min(Math.min(W,H)*.36,32+elapsed*9*tuneLook);
      target.x=cx+Math.cos(a)*rad;
      target.y=cy+Math.sin(a)*rad;
      steerToward(target.x,target.y,3.0*tuneGain,dt);
      advance(37*tuneSpeed,dt);
    }

    else if(f==="adaptive"){
      const idx=nearestRouteIndex();
      const p1=route[Math.min(route.length-1,idx+8)];
      const p2=route[Math.min(route.length-1,idx+24)];
      const h1=Math.atan2(p1.y-robot.y,p1.x-robot.x);
      const h2=Math.atan2(p2.y-p1.y,p2.x-p1.x);
      const curve=Math.abs(wrap(h2-h1));
      const rep=obstacleVector();
      const factor=clamp(1-curve*.9-(rep.nearest<90?.28:0),.38,1.18);
      const p=route[Math.min(route.length-1,idx+Math.round(12*tuneLook))];
      steerToward(p.x,p.y,3.3*tuneGain,dt);
      advance(46*tuneSpeed*factor,dt);
    }
  }

  function step(dt){
    t+=dt;
    if(state!=="running")return;

    elapsed+=dt;
    familyStep(dt);

    // Adjustable disturbance: a small lateral motion that makes the effect
    // of steering gain and look-ahead visible instead of purely numerical.
    if(tuneDisturbance>0){
      const nx=-Math.sin(robot.th), ny=Math.cos(robot.th);
      const wave=Math.sin(elapsed*2.3)+0.55*Math.sin(elapsed*4.7+1.1);
      const push=tuneDisturbance*7.0*wave*dt;
      robot.x=clamp(robot.x+nx*push,13,W-13);
      robot.y=clamp(robot.y+ny*push,13,H-13);
    }

    // Universal navigation error shown for every autonomy family.
    // Route modes use cross-track error; goal/target modes use a normalized
    // target error so tuning changes are still visible.
    let liveError=0;
    const f=mode.family.id;
    if(f==="path"||f==="adaptive"){
      nearestRouteIndex();
      liveError=robot.error;
    }else if(f==="waypoint"){
      const p=waypoints[robot.wp%waypoints.length];
      liveError=Math.hypot(robot.x-p.x,robot.y-p.y)*0.18;
    }else if(f==="tracking"||f==="search"){
      liveError=Math.abs(Math.hypot(robot.x-target.x,robot.y-target.y)-70)*0.28;
    }else if(f==="dock"){
      liveError=Math.hypot(robot.x-dock.x,robot.y-dock.y)*0.12;
    }else if(f==="home"){
      const p=elapsed>4?home:{x:W*.78,y:H*.20};
      liveError=Math.hypot(robot.x-p.x,robot.y-p.y)*0.12;
    }else if(f==="corridor"){
      const desiredY=H*.52+Math.sin((robot.x/W)*Math.PI*3)*28;
      liveError=Math.abs(robot.y-desiredY);
    }else if(f==="perimeter"){
      const pad=54*tuneLook;
      const edge=Math.min(
        Math.abs(robot.x-pad),Math.abs(robot.x-(W-pad)),
        Math.abs(robot.y-pad),Math.abs(robot.y-(H-pad))
      );
      liveError=edge;
    }else{
      liveError=Math.abs(robot.v-(40*tuneSpeed))*0.35;
    }

    const errorMeters=pxToMeters(liveError);
    robot.error=errorMeters;
    errorSum+=errorMeters;
    errorSamples++;
    errorMax=Math.max(errorMax,errorMeters);

    if(elapsed>=DEMO_DURATION){
      elapsed=DEMO_DURATION;
      state="complete";
      robot.v=0;
    }

    updateUI();
  }

  function drawGrid(ctx){
    ctx.fillStyle="#edf3f4";
    ctx.fillRect(0,0,W,H);

    ctx.save();
    ctx.strokeStyle="rgba(60,85,95,.09)";
    ctx.lineWidth=1;
    for(let x=0;x<W;x+=30){ctx.beginPath();ctx.moveTo(x,0);ctx.lineTo(x,H);ctx.stroke();}
    for(let y=0;y<H;y+=30){ctx.beginPath();ctx.moveTo(0,y);ctx.lineTo(W,y);ctx.stroke();}
    ctx.restore();
  }

  function drawRoute(ctx){
    if(!["path","adaptive"].includes(mode.family.id))return;

    ctx.save();
    ctx.strokeStyle="rgba(255,255,255,.98)";
    ctx.lineWidth=11;
    ctx.lineCap="round";
    ctx.lineJoin="round";
    ctx.beginPath();
    ctx.moveTo(route[0].x,route[0].y);
    route.slice(1).forEach(p=>ctx.lineTo(p.x,p.y));
    ctx.stroke();

    ctx.strokeStyle=PAL.accent;
    ctx.lineWidth=2.8;
    ctx.setLineDash([11,7]);
    ctx.beginPath();
    ctx.moveTo(route[0].x,route[0].y);
    route.slice(1).forEach(p=>ctx.lineTo(p.x,p.y));
    ctx.stroke();
    ctx.restore();
  }

  function drawObstacles(ctx){
    const f=mode.family.id;
    if(!["avoid","adaptive","corridor"].includes(f))return;

    if(f==="corridor"){
      ctx.save();
      ctx.fillStyle="rgba(89,108,117,.24)";
      ctx.fillRect(0,H*.25,W,H*.15);
      ctx.fillRect(0,H*.64,W,H*.15);
      ctx.strokeStyle="#5a6d76";
      ctx.lineWidth=2;
      ctx.beginPath();ctx.moveTo(0,H*.40);ctx.lineTo(W,H*.40);ctx.stroke();
      ctx.beginPath();ctx.moveTo(0,H*.64);ctx.lineTo(W,H*.64);ctx.stroke();
      ctx.restore();
      return;
    }

    obstacles.forEach((o,i)=>{
      ctx.save();
      ctx.fillStyle="#5d6b72";
      ctx.beginPath();ctx.arc(o.x,o.y,o.r,0,Math.PI*2);ctx.fill();
      ctx.strokeStyle="#34434a";
      ctx.lineWidth=2;
      ctx.stroke();
      ctx.fillStyle="#fff";
      ctx.font="700 8px 'Space Mono', monospace";
      ctx.textAlign="center";
      ctx.fillText(`OBS ${i+1}`,o.x,o.y+3);
      ctx.restore();
    });
  }

  function drawFamilyFeatures(ctx){
    const f=mode.family.id;

    if(f==="waypoint"){
      waypoints.forEach((p,i)=>{
        ctx.save();
        ctx.strokeStyle=i===robot.wp%waypoints.length?"#efb522":"#87979e";
        ctx.lineWidth=i===robot.wp%waypoints.length?3:1.5;
        ctx.beginPath();ctx.arc(p.x,p.y,11,0,Math.PI*2);ctx.stroke();
        ctx.fillStyle="#41515a";
        ctx.font="700 8px 'Space Mono', monospace";
        ctx.textAlign="center";
        ctx.fillText(`${i+1}`,p.x,p.y+3);
        ctx.restore();
      });
    }

    if(f==="tracking"||f==="search"){
      ctx.save();
      ctx.strokeStyle="#47bd76";
      ctx.lineWidth=3;
      ctx.beginPath();ctx.arc(target.x,target.y,14+Math.sin(t*3)*2,0,Math.PI*2);ctx.stroke();
      ctx.fillStyle="#47bd76";
      ctx.beginPath();ctx.arc(target.x,target.y,4,0,Math.PI*2);ctx.fill();
      ctx.font="700 8px 'Space Mono', monospace";
      ctx.fillText(f==="tracking"?"MOVING TARGET":"SEARCH TARGET",target.x-27,target.y-20);
      ctx.restore();
    }

    if(f==="patrol"){
      const pts=[
        {x:W*.18,y:H*.22},{x:W*.82,y:H*.22},
        {x:W*.82,y:H*.75},{x:W*.18,y:H*.75}
      ];
      pts.forEach((p,i)=>{
        ctx.strokeStyle=i===robot.wp%4?"#efb522":"#88979e";
        ctx.lineWidth=i===robot.wp%4?3:1.5;
        ctx.beginPath();ctx.arc(p.x,p.y,10,0,Math.PI*2);ctx.stroke();
      });
    }

    if(f==="coverage"){
      ctx.save();
      ctx.strokeStyle="rgba(64,117,145,.30)";
      ctx.setLineDash([5,5]);
      for(let r=0;r<7;r++){
        const y=H*(.16+r*.105);
        ctx.beginPath();ctx.moveTo(W*.14,y);ctx.lineTo(W*.86,y);ctx.stroke();
      }
      ctx.restore();
    }

    if(f==="perimeter"){
      const pad=54*tuneLook;
      ctx.save();
      ctx.strokeStyle="#6c8795";
      ctx.lineWidth=2;
      ctx.setLineDash([8,6]);
      ctx.strokeRect(pad,pad,W-2*pad,H-2*pad);
      ctx.restore();
    }

    if(f==="dock"){
      ctx.save();
      ctx.fillStyle="#40515a";
      ctx.fillRect(dock.x-20,dock.y-16,40,32);
      ctx.fillStyle="#fff";
      ctx.font="700 8px 'Space Mono', monospace";
      ctx.textAlign="center";
      ctx.fillText("DOCK",dock.x,dock.y+3);
      ctx.strokeStyle="#47bd76";
      ctx.lineWidth=2;
      ctx.beginPath();ctx.arc(dock.x,dock.y,31,0,Math.PI*2);ctx.stroke();
      ctx.restore();
    }

    if(f==="home"){
      ctx.save();
      ctx.fillStyle="#47bd76";
      ctx.beginPath();ctx.arc(home.x,home.y,12,0,Math.PI*2);ctx.fill();
      ctx.fillStyle="#2d7047";
      ctx.font="700 8px 'Space Mono', monospace";
      ctx.textAlign="center";
      ctx.fillText("HOME",home.x,home.y+28);
      ctx.restore();
    }
  }

  function drawSensors(ctx){
    if(!showSensors)return;
    const f=mode.family.id;

    ctx.save();

    if(["avoid","adaptive"].includes(f)){
      ctx.strokeStyle="#4ac7ff";
      ctx.globalAlpha=.40;
      ctx.lineWidth=1.3;
      for(let i=-5;i<=5;i++){
        const a=robot.th+i*.10;
        const len=95*mode.style.safety*(.70+.30*tuneLook);
        ctx.beginPath();ctx.moveTo(robot.x,robot.y);
        ctx.lineTo(robot.x+Math.cos(a)*len,robot.y+Math.sin(a)*len);ctx.stroke();
      }
    }

    if(f==="corridor"){
      ctx.strokeStyle="#4ac7ff";
      ctx.globalAlpha=.65;
      ctx.lineWidth=2;
      ctx.beginPath();ctx.moveTo(robot.x,robot.y);ctx.lineTo(robot.x, H*.40);ctx.stroke();
      ctx.beginPath();ctx.moveTo(robot.x,robot.y);ctx.lineTo(robot.x, H*.64);ctx.stroke();
    }

    if(f==="tracking"){
      ctx.strokeStyle="#47bd76";
      ctx.globalAlpha=.55;
      ctx.setLineDash([6,5]);
      ctx.beginPath();ctx.moveTo(robot.x,robot.y);ctx.lineTo(target.x,target.y);ctx.stroke();
    }

    ctx.restore();
  }

  function drawTrail(ctx){
    if(!showTrail||robot.trail.length<2)return;
    ctx.save();
    ctx.strokeStyle=PAL.blue;
    ctx.lineWidth=2.2;
    ctx.globalAlpha=.90;
    ctx.beginPath();
    ctx.moveTo(robot.trail[0].x,robot.trail[0].y);
    robot.trail.slice(1).forEach(p=>ctx.lineTo(p.x,p.y));
    ctx.stroke();
    ctx.restore();
  }

  function drawRobot(ctx){
    ctx.save();
    ctx.translate(robot.x,robot.y);
    ctx.rotate(robot.th);

    ctx.shadowBlur=10;
    ctx.shadowColor=PAL.accent;
    ctx.fillStyle=PAL.accent;
    ctx.fillRect(-15,-9,30,18);

    ctx.shadowBlur=0;
    ctx.fillStyle="#26343c";
    ctx.fillRect(-11,-13,8,5);
    ctx.fillRect(4,-13,8,5);
    ctx.fillRect(-11,8,8,5);
    ctx.fillRect(4,8,8,5);

    ctx.fillStyle="#e7f8ff";
    ctx.fillRect(7,-4,6,8);

    ctx.fillStyle="#fff";
    ctx.beginPath();
    ctx.moveTo(18,0);
    ctx.lineTo(10,-5);
    ctx.lineTo(10,5);
    ctx.closePath();
    ctx.fill();

    ctx.restore();
  }

  function draw(ctx,w,h){
    drawGrid(ctx);
    drawRoute(ctx);
    drawObstacles(ctx);
    drawFamilyFeatures(ctx);
    drawTrail(ctx);
    drawSensors(ctx);
    drawRobot(ctx);

    ctx.save();
    ctx.fillStyle="rgba(31,44,52,.84)";
    ctx.fillRect(12,12,360,84);

    ctx.font="700 10px 'Space Mono', monospace";
    ctx.fillStyle="#fff";
    ctx.fillText(mode.family.name.toUpperCase(),24,31);

    ctx.font="400 9px 'Space Mono', monospace";
    ctx.fillStyle="#d7e6ec";
    ctx.fillText(`STYLE: ${mode.style.name.toUpperCase()}`,24,49);

    ctx.fillStyle="#ffd45a";
    ctx.fillText(`RUN ${elapsed.toFixed(1)} / ${DEMO_DURATION.toFixed(0)} s`,24,66);

    ctx.fillStyle="#91ddaa";
    ctx.fillText(`SPEED ${speedMetersPerSecond().toFixed(2)} m/s`,165,66);

    ctx.fillStyle="#a9d9ef";
    ctx.fillText(`HEADING ${(robot.th*180/Math.PI).toFixed(0)}°`,270,66);

    ctx.fillStyle="#dfeaf0";
    ctx.fillText(`SENSOR: ${mode.family.sensor}`,24,83);

    ctx.restore();

    if(state==="complete"){
      ctx.save();
      ctx.fillStyle="rgba(22,33,39,.34)";
      ctx.fillRect(0,0,w,h);
      ctx.textAlign="center";
      ctx.font="700 35px 'Barlow Condensed', sans-serif";
      ctx.fillStyle="#fff";
      ctx.fillText("20-SECOND DEMO COMPLETE",w/2,h/2-10);
      ctx.font="400 10px 'Space Mono', monospace";
      ctx.fillStyle="#dfeaf0";
      ctx.fillText("CHOOSE ANOTHER MODE OR PRESS RUN AGAIN",w/2,h/2+18);
      ctx.restore();
    }
  }

  function updateUI(){
    q("#modeFamily").textContent=mode.family.name;
    q("#modeStyle").textContent=mode.style.name;
    q("#modeState").textContent=
      state==="running"?"Running":
      state==="complete"?"Complete":
      state==="paused"?"Paused":"Ready";

    q("#modeTime").textContent=`${elapsed.toFixed(1)} / ${DEMO_DURATION} s`;
    q("#modeSpeed").textContent=`${speedMetersPerSecond().toFixed(2)} m/s`;
    q("#modeHeading").textContent=`${(robot.th*180/Math.PI).toFixed(0)}°`;
    q("#modeError").textContent=`${robot.error.toFixed(2)} m`;

    const avgError=errorSamples?errorSum/errorSamples:0;
    q("#currentError").textContent=`${robot.error.toFixed(2)} m`;
    q("#averageError").textContent=`${avgError.toFixed(2)} m`;
    q("#maximumError").textContent=`${errorMax.toFixed(2)} m`;
    q("#errorBar").style.width=`${Math.min(100,robot.error/1.20*100)}%`;

    q("#tuneSpeedValue").textContent=`${tuneSpeed.toFixed(2)}×`;
    q("#tuneGainValue").textContent=tuneGain.toFixed(2);
    q("#tuneLookValue").textContent=tuneLook.toFixed(2);
    q("#tuneDisturbanceValue").textContent=tuneDisturbance.toFixed(1);

    q("#modeTitle").textContent=mode.label;
    q("#modeDescription").textContent=`${mode.family.desc} ${mode.style.desc}`;
    q("#modeSensor").textContent=mode.family.sensor;
    q("#modeWatch").textContent=mode.family.watch;

    q("#demoProgress").style.width=`${Math.min(100,elapsed/DEMO_DURATION*100)}%`;

    q("#sensorToggle").classList.toggle("on",showSensors);
    q("#trailToggle").classList.toggle("on",showTrail);
  }

  function selectMode(id){
    mode=MODES.find(m=>m.id===id)||MODES[0];
    resetTuningFromMode();
    resetRobot();
    updateUI();
    sim.redraw();
  }

  function runDemo(){
    if(state==="complete")resetRobot();
    state="running";
    updateUI();
    sim.start();
  }

  const sim=makeSim(cv,{step,draw,resize});

  // Populate one dropdown with all 120 modes, grouped by autonomy family.
  const select=q("#autonomyMode");
  FAMILIES.forEach(f=>{
    const group=document.createElement("optgroup");
    group.label=f.name;
    MODES.filter(m=>m.family.id===f.id).forEach(m=>{
      const opt=document.createElement("option");
      opt.value=m.id;
      opt.textContent=m.label;
      group.appendChild(opt);
    });
    select.appendChild(group);
  });
  select.value=mode.id;

  select.addEventListener("change",()=>selectMode(select.value));

  q("#runDemo").addEventListener("click",runDemo);

  q("#pauseDemo").addEventListener("click",()=>{
    if(state==="running"){
      state="paused";
      robot.v=0;
      updateUI();
      sim.redraw();
    }
  });

  q("#resetDemo").addEventListener("click",()=>{
    resetRobot();
    sim.redraw();
  });

  q("#sensorToggle").addEventListener("click",()=>{
    showSensors=!showSensors;
    updateUI();
    sim.redraw();
  });

  q("#trailToggle").addEventListener("click",()=>{
    showTrail=!showTrail;
    if(!showTrail)robot.trail=[];
    updateUI();
    sim.redraw();
  });

  q("#tuneSpeed").addEventListener("input",e=>{
    tuneSpeed=+e.target.value;
    updateUI();
  });

  q("#tuneGain").addEventListener("input",e=>{
    tuneGain=+e.target.value;
    updateUI();
  });

  q("#tuneLook").addEventListener("input",e=>{
    tuneLook=+e.target.value;
    updateUI();
  });

  q("#tuneDisturbance").addEventListener("input",e=>{
    tuneDisturbance=+e.target.value;
    updateUI();
  });

  q("#resetTuning").addEventListener("click",()=>{
    resetTuningFromMode();
    resetErrorStats();
    robot.error=0;
    updateUI();
    sim.redraw();
  });

  resetTuningFromMode();
  resetRobot();
  updateUI();
  sim.start();
}

function mediaHTML(p,i){

    <img src="${esc(v.src)}" alt="${esc(p.title)} animation" loading="lazy">
    <div class="gif-label">${esc(v.label||"Animated demo")}</div>

  const poster = v.poster || (v.type==="youtube"?`https://i.ytimg.com/vi/${v.id}/hqdefault.jpg`:"");

    ${poster?`<img src="${esc(poster)}" alt="" loading="lazy" onerror="this.remove()">`:""}

function bibtex(p){
  const surname = p.authors.split(",")[0].trim().split(/\s+/).pop().toLowerCase();

    .find(w=>w.length>4&&!["under","which","their","these","about","using","design"].includes(w))||"work";

  const authors = p.authors.split(",").map(a=>a.trim()).join(" and ");
  if(p.type==="thesis")
    return `@mastersthesis{${key},\n  title  = {${p.title}},\n  author = {${authors}},\n  school = {${p.school}},\n  year   = {${p.year}}\n}`;

    p.status==="In press"?`  note    = {In press}`:null].filter(Boolean).join(",\n");

/* ───────────── reveal + count-up ───────────── */
let io;
function observeReveals(){
  if(io) io.disconnect();
  io = new IntersectionObserver(entries=>entries.forEach(en=>{
    if(!en.isIntersecting) return;
    en.target.classList.add("in");
    en.target.querySelectorAll?.("[data-count]").forEach(c=>{ if(!REDUCED) countUp(c); });
    io.unobserve(en.target);
  }),{ rootMargin:"0px 0px -8% 0px", threshold:.05 });
  $$(".reveal, .dim, .tl").forEach((el,i)=>{
    el.style.transitionDelay = `${Math.min(i,6)*60}ms`; io.observe(el);
  });
}
function countUp(el){
  const raw = el.textContent, m = raw.match(/-?−?\d+(\.\d+)?/g);
  if(!m||m.length!==1) return;
  const target = parseFloat(m[0].replace("−","-")), dec = (m[0].split(".")[1]||"").length;
  const t0 = performance.now();
  const tick = now => {
    const k=Math.min(1,(now-t0)/950), e=1-Math.pow(1-k,3);
    el.textContent = raw.replace(m[0],(target<0?"−":"")+Math.abs(target*e).toFixed(dec));
    if(k<1) requestAnimationFrame(tick); else el.textContent = raw;
  };
  requestAnimationFrame(tick);
}

function pageInit(path){
  if(path==="/"){
    const f=$("#logicLab");
    if(f) roboticsLearning(f);
  }

  if(path==="/contact"){
    const form=$("#contactForm");
    if(form){
      form.addEventListener("submit",async e=>{
        e.preventDefault();

        const status=$("#contactStatus");
        const submitBtn=form.querySelector('button[type="submit"]');

        if(!form.reportValidity()) return;

        submitBtn.disabled=true;
        status.textContent="Sending message…";

        try{
          const formData=new FormData(form);
          const object=Object.fromEntries(formData);

          const response=await fetch("https://api.web3forms.com/submit",{
            method:"POST",
            headers:{
              "Content-Type":"application/json",
              "Accept":"application/json"
            },
            body:JSON.stringify(object)
          });

          const data=await response.json();

          if(response.ok && data.success){
            form.reset();
            status.textContent="Message sent successfully. Thank you.";
          }else{
            status.textContent=data.message || "Message could not be sent. Please try again.";
          }
        }catch(err){
          status.textContent="Message could not be sent. Please try again.";
        }finally{
          submitBtn.disabled=false;
        }
      });
    }
  }
  if(path==="/projects"){
    $$(".sim-slot").forEach(slot=>{
      const kind=slot.dataset.sim;
      if(kind==="suspension") { slot.innerHTML=SUSP_TPL; suspensionSim(slot.querySelector(".sim")); }
      else if(kind==="navigation") { slot.innerHTML=NAV_TPL; motionNavSim(slot.querySelector(".sim")); }
      else if(kind==="cloud") { slot.innerHTML=CLOUD_TPL; cloudSim(slot.querySelector(".sim")); }
    });
    view.addEventListener("click", onProjectClick);
  }
  if(path==="/papers") view.addEventListener("click", onPaperClick);
}
let current = null;
function render(){
  let path = location.hash.replace(/^#/,"") || "/";
  if(!PAGES[path]) path = "/";
  if(path===current) return;
  const first = current===null;
  current = path;
  const swap = () => {
    view.removeEventListener("click", onProjectClick);
    view.removeEventListener("click", onPaperClick);
    killSims();
    view.innerHTML = PAGES[path]();
    view.classList.remove("leaving");
    if(!first) scrollTo({ top:0, behavior:"instant" });
    markNav(path); pageInit(path); observeReveals();
    navEl.classList.remove("open");
  };
  if(first||REDUCED) swap();
  else { view.classList.add("leaving"); setTimeout(swap,230); }
}

function paint(){
  document.documentElement.setAttribute("data-theme", dark?"dark":"light");
  tbtn.innerHTML = dark?SUN:MOON;
  tbtn.setAttribute("aria-label", dark?"Switch to light theme":"Switch to dark theme");
  readPalette(); SIMS.forEach(s=>s.redraw());
}
tbtn.addEventListener("click", ()=>{ dark=!dark; paint(); });
paint();

const prog = $("#prog");
addEventListener("scroll", ()=>{
  const h = document.documentElement.scrollHeight - innerHeight;
  prog.style.width = (h>0?(scrollY/h)*100:0)+"%";
},{ passive:true });

render();
</script>
</body>
</html>
